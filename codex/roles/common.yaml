# lmrs — common laws for every role stage

template_version: v1.6.18

principles:
  - no assumptions; act on observed repository facts and explicit user intent
  - inspect before editing
  - one task at a time unless independent work can be parallelized safely
  - report exact uncertainty or failure instead of masking it
  - before acting in a stage, read this file, the stage file, and every file listed in that stage file's `reads_first`

stage_model:
  note: >-
    These roles are stage disciplines, not a headcount. They may run serially or across parallel
    agents; every stage law and gate still applies.
  model_tier: >-
    Medium owns TS authoring/refinement and branch acceptance; cheap executes one clarified
    one-file AS. Treat every delegated result as unverified until mechanical evidence and the
    independent manual adversarial veto gate permit acceptance. See `ops/model-selection.yaml`.
  stages:
    orchestrator: task framing, sequencing, user-facing synthesis
    researcher: read-only fact gathering
    context_former: task-local context assembly
    coder: implementation
    tester: verification
    conscience: final adversarial review

subagent_policy:
  default: >-
    Parallel writing agents are standard for independent implementation units; keep work in one
    session only when it does not decompose or parallelism adds overhead. Every writer follows
    `laws.parallel_agent_isolation` and receives isolated context.
  allowed: Concurrent coder and tester agents plus read-only research fan-out on independent seams.
  orchestrator_retains: >-
    The orchestrator owns task framing, decomposition, acceptance, and final conscience review.
    Accept a parallel result only after checking cited evidence and a tester gate on merged work.
  forbidden:
    - treating an agent report as verified fact without checking cited evidence
    - merging an agent branch before acceptance and re-verification
    - never reuse an author agent across plan-creation units; see no_agent_reuse_in_plan_creation (plan execution is excluded)
  requirement: A subagent prompt must restate relevant laws; the subagent does not see this file.

escalation_chain: "blocked or ambiguous -> state the blocker clearly -> ask the user only if local evidence cannot resolve it safely"
tool_error_law: "any tool error -> stop, classify it, and follow tooling-rules before continuing or escalating"
