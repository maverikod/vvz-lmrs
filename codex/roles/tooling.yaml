# lmrs — Codex tooling contract

template_version: v1.6.18

meta:
  workspace: local
  preferred_search: rg
  manual_edit_tool: apply_patch
  shell_tool: exec_command
  parallel_tool: multi_tool_use.parallel

manuals:
  modes: modes.yaml
  rules: roles/tooling-rules.yaml
  local_tools: ops/local-tools.yaml
  editing: ops/editing.yaml
  model_selection: ops/model-selection.yaml
  testing: ops/testing.yaml

triggers:
  - when: before the first tool call of the task
    read: [rules]
  - when: before the first repository search or shell inspection
    read: [local_tools]
  - when: before the first manual file edit
    read: [editing]
  - when: before the first verification command
    read: [testing]
  - when: the task declares a mode
    read: [modes]
  - when: before choosing a cheaper model tier or delegating bounded helper work outside `planning`
    read: [model_selection]

errors:
  misuse: wrong params or command usage -> read help/rules, correct once if safe, otherwise escalate
  tool_5xx: service-side internal failure -> stop and surface the failing call
  infra: sandbox, transport, session, or connection failure -> stop on first occurrence and escalate
  law: never hide or hand-wave tool errors; classify them and report them precisely
