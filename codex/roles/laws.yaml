# lmrs — standing laws for Codex

variables:
  file_access: local      # local (default) | cas | local_ide. Selects the active work site.
  local_branch: local
  cas_branch: cas
  transfer_branch: main
  verification: required

laws:
  active_profile_declaration: >-
    [TRIGGER: first action of any task] `variables.file_access` decides where work happens and
    which tools are legitimate. Read it before the first project action and state the active
    profile. The default is `local`; only the user may change it. Never infer a switch or switch
    after a tool failure. If the value is missing or unreadable, stop and ask.
  local_workspace_truth: >-
    Under `local`, the local checkout is the source of truth. Under `cas`, the registered
    Code Analysis Server project is authoritative instead and this law yields to `cas_mode`.
  branch_discipline: >-
    There are three branches: `local` is local work, `cas` is server-side work, and `main` is
    transfer-only. Work only on the branch for the active site. Never edit `main` directly and
    never merge `local` directly with `cas`. Synchronize `main` into the active branch before
    work. Build, deploy, and run live acceptance from the active branch. Only after live
    verification is green, merge that branch into local `main`; do not push it. Report the ready
    commit and wait for explicit user confirmation. The opposite site then pulls `main` through
    its authoritative Git surface, verifies the commit, and merges it into its own work branch.
  parallel_agent_isolation: >-
    [TRIGGER: launching more than one writing agent] Concurrent agents never share a working
    tree or branch. In a local profile, give each agent a dedicated `git worktree` and branch.
    In a CAS profile, use the equivalent isolated server-side working copy and branch admitted by
    CAS Git. Each agent edits and verifies only its own isolated copy. Integrate only after
    acceptance: merge into the active branch, resolve conflicts there, and re-run `pipeline` on
    the merged result. Discard rejected work without a partial merge. Parallel writing is normal,
    but this law never relaxes tester, conscience, zero-trust, or orchestrator acceptance gates.
  local_mode: >-
    [active when variables.file_access=local] Reads, edits, tests, builds, and release
    preparation use the local checkout on `local`. MCP Proxy is only for analysis and
    CAS-authoritative Git sync: never use it to execute a build, test, or deploy script, edit a
    file, or enter a terminal sandbox/host-exec path for ordinary work.
  cas_mode: >-
    [active when variables.file_access=cas] All project reads, edits, verification, and Git
    target the registered CAS project on `cas` through MCP Proxy. Never fall back to local tools.
  local_ide_mode: >-
    [active when variables.file_access=local_ide] The human edits local files through the IDE.
    The agent only supplies proposed patches or diffs; CAS via MCP Proxy remains available for
    search and analysis. Branch rules follow the `local` branch-discipline clause.
  no_assumption_policy: >-
    Do not claim behavior, architecture intent, or test status without repository evidence.
  inspect_before_edit: >-
    Before changing a file, read the relevant sections and understand nearby code and local diffs.
  patch_only_manual_edits: >-
    Manual source edits should use patch-based updates so the change boundary stays explicit.
  preserve_user_work: >-
    Never overwrite or revert unrelated changes you did not make unless the user explicitly asks.
  non_destructive_git: >-
    Avoid destructive git commands unless the user explicitly requests them and the risk is clear.
  escalation_first_error: >-
    Stop on the first infrastructure or transport failure, capture the exact failing command and
    error text, and escalate instead of retrying blindly.
  reproduce_before_claiming: >-
    Do not declare tooling broken from a single flaky run; first inspect usage and reproduce
    cleanly unless the failure is already a hard infrastructure blocker.
  editor_gate_no_bypass: >-
    If validation or quality gates fail after an edit, fix the underlying issue or report the
    blocker; do not bypass the gate just to force a write-through.
  bugfix_acceptance_cycle: >-
    [TRIGGER: any bug fix] The mandatory bug-fix algorithm is, in order: (1) REPRODUCE the
    defect on the REAL DEPLOYED SERVER, on the real failing path — never from a report, mock, or
    stub; (2) IMMEDIATELY add a named covering `pipeline` check, run `pipeline <check-name>`
    against that same real server, and confirm it FAILS. This RED run CONFIRMS REPRODUCTION
    through the pipeline; it is not testing and says nothing about a fix. Do not change code
    before it is RED; (3) FIND the root cause; (4) PROVE the cause-to-symptom link; (5) FIX with
    focused regression coverage; (6) TEST locally with `pipeline` and confirm GREEN, including
    the step-(2) check; (7) BUMP the version by exactly +1 before deployment; (8) BUILD with
    `build.sh`; (9) DEPLOY to `root@192.168.254.26` and publish any client to PyPI at that version;
    (10) RUN `pipeline` against the real deployed server and SMOKE-TEST the original path. This
    cycle is mandatory; work is not accepted until every applicable step passes.
  pipeline_cli_contract: >-
    [TRIGGER: any verification, deploy, or server start] The project MUST ship a pipeline
    package that becomes a plain CLI application after `pip install -e .`. The command is named
    `pipeline` in every project without exception, so one invocation works across the whole
    fleet. `pipeline` with no arguments runs the ENTIRE suite: every test and every check.
    `pipeline <check-name>` runs ONLY that check, and `pipeline --list` enumerates the available
    check names. This one command is the single verification entrypoint in every context: local
    verification before delivery, the mandatory run against the real deployed server after any
    deploy, and the smoke run after a normal server start. Never hand-roll a second runner, a
    parallel script, or an ad-hoc command list for any of those contexts; a missing check is
    added to this pipeline as a new named check. A project without this CLI has a gap that must
    be closed before the work is accepted.
  cheapest_capable_model: >-
    [TRIGGER: any delegation, helper-model use, or model choice outside `planning` mode] Push
    the work down to the cheapest model tier that can plausibly carry it, and never to a tier
    that cannot. Lower effort before raising the tier. State what the task requires before
    choosing; do not pick a higher tier by habit. On failure, move up exactly one tier once,
    then escalate; never loop on the same cheap attempt. `planning` mode is exempt: task
    framing, mode routing, acceptance structure, and architectural decisions stay at the session
    tier, because a cheap model must not choose the plan. See `ops/model-selection.yaml`.
  zero_trust_cheap_output: >-
    [TRIGGER: any result produced by a cheaper tier] Output from a cheaper tier is a claim, not
    a fact, and the stage that used it owns the verification. Read the files a result cites
    before repeating its conclusion; re-run any command reported as passing; treat "found
    nothing" as unverified until the search is reproduced; never forward a cheap-tier summary to
    the user as an established finding. The `tester` verdict, the `conscience` review, every
    acceptance gate, and the definition of the task itself are never delegated downward. If
    verifying costs more attention than doing the work at the higher tier, the cheap tier was
    the wrong choice; say so and move up instead of skipping verification.
  verify_before_delivery: >-
    Verify through the `pipeline` CLI. Run the narrowest covering check first
    (`pipeline <check-name>`), then full `pipeline` before delivery. If verification cannot run,
    say so plainly.
  exact_failure_reporting: >-
    When a command or test fails, report the exact failing command and the important error details.
  artifact_language: >-
    Keep prompts, code comments, and repository artifacts in English unless the project requires another language.
