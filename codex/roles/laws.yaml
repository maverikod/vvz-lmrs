# lmrs — standing laws for Codex

variables:
  workspace_truth: local
  verification: required

laws:
  local_workspace_truth: >-
    The local checkout is the default source of truth. Read files locally, edit only in the
    workspace, and do not invent hidden remote state.
  branch_discipline: >-
    Keep a clear working-branch policy for local changes, avoid direct history rewrites on shared
    branches, and document how verified work is promoted. If the project has no formal branch
    contract yet, define one here instead of silently omitting the law.
  no_assumption_policy: >-
    Do not claim behavior, architecture intent, or test status without repository evidence.
  inspect_before_edit: >-
    Before changing a file, read the relevant sections and understand nearby code and local diffs.
  patch_only_manual_edits: >-
    Manual source edits should use patch-based updates so the change boundary stays explicit.
  preserve_user_work: >-
    Never overwrite or revert unrelated changes you did not make unless the user explicitly asks.
  non_destructive_git: >-
    Avoid destructive git commands unless the user explicitly requests them and the risk is clear.
  escalation_first_error: >-
    Stop on the first infrastructure or transport failure, capture the exact failing command and
    error text, and escalate instead of retrying blindly.
  reproduce_before_claiming: >-
    Do not declare tooling broken from a single flaky run; first inspect usage and reproduce
    cleanly unless the failure is already a hard infrastructure blocker.
  editor_gate_no_bypass: >-
    If validation or quality gates fail after an edit, fix the underlying issue or report the
    blocker; do not bypass the gate just to force a write-through.
  bugfix_acceptance_cycle: >-
    [TRIGGER: any bug fix] The mandatory bug-fix algorithm is, in order: (1) REPRODUCE the
    defect on the real failing path; (2) ADD a covering check for that defect to the project's
    test pipeline and confirm it fails before further changes; (3) FIND the root cause in code;
    (4) PROVE the cause-to-symptom link with concrete evidence; (5) FIX the defect with focused
    regression coverage; (6) BUMP the project version by exactly +1 before any deployment; (7)
    DEPLOY via ssh to `root@192.168.254.26` and, if the project ships a client, publish that
    client to PyPI at the same version; (8) RUN the test pipeline against the real deployed
    server and SMOKE-TEST the original bug path on the live system. This cycle is mandatory, not
    advisory. Work is not accepted until every applicable step passes.
  verify_before_delivery: >-
    Run the smallest relevant checks for the touched area. If verification cannot run, say so plainly.
  exact_failure_reporting: >-
    When a command or test fails, report the exact failing command and the important error details.
  artifact_language: >-
    Keep prompts, code comments, and repository artifacts in English unless the project requires another language.
