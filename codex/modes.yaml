# lmrs — mode -> trigger map for Codex

header_rule: >-
  The active mode determines which operational manuals must be read before the first
  matching action. Modes add constraints; they do not replace common laws.

modes:
  planning:
    aliases: [planning, plan]
    description: >-
      Authoring, verifying, freezing, or operating a structured planning runtime
      (requirements hierarchy, execution records, review gates, and planning artifacts).
    always_read: [ops/planning-runtime.yaml]
    triggers:
      - when: authoring or revising planning artifacts or acceptance structure
        read: [ops/planning-authoring.yaml]

  analysis:
    aliases: [analysis, inspect]
    description: >-
      Read-only inspection of code, docs, tests, interfaces, and repository structure.
    always_read: [ops/local-tools.yaml]
    triggers:
      - when: first repository-wide search or file inventory
        read: [ops/local-tools.yaml]

  refactoring:
    aliases: [refactoring, implement]
    description: >-
      Code changes, file creation, cleanup, and verification in the local workspace.
    always_read: [ops/local-tools.yaml, ops/editing.yaml]
    triggers:
      - when: first manual file edit
        read: [ops/editing.yaml]
      - when: first relevant test or lint run
        read: [ops/testing.yaml]
