# Planning authoring guidance

rules:
  - define scope, acceptance criteria, and execution order explicitly
  - record review checkpoints and dependency assumptions in the planning artifact
  - when converting user intent into implementation work, preserve a stable planning vocabulary
  - one atomic step (A-step) processes exactly one project file of any kind; one file may be processed by several A-steps in priority order
  - while creating plan artifacts, use one fresh author agent per authoring unit; see `no_agent_reuse_in_plan_creation`

atomic_step_file_rule: >-
  One A-step processes EXACTLY ONE project file. The file may be code, documentation,
  configuration, a schema, or any other project artifact. An A-step touching two or more files
  is forbidden; one file may be processed by several A-steps in priority order.

no_agent_reuse_in_plan_creation: >-
  [TRIGGER: creating plan artifacts in planning mode] Never reuse an author agent for another
  authoring unit. Every step or artifact receives a fresh child identity and clean scoped context.
  An author that has produced one unit is spent: spawn a new child instead of continuing or
  following up with it for the next unit. Reuse is a plan defect because cumulative context
  pollution carries prior drafts, rejected options, and conclusions into the next unit. This ban
  applies only to plan creation; it does not change plan execution ownership or ordinary
  refactor/repair delegation.
