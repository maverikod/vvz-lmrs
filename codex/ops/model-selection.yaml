# Codex model selection and zero-trust verification

principle: >-
  Codex planning has fixed ownership: workhorse authors/refines TS and formally accepts a branch;
  cheap executes one clarified, narrow AS for exactly one project file. Every result remains
  untrusted until mechanical evidence and an independent negative manual review permit acceptance.

mode_gate:
  planning: >-
    TS is owned by medium and AS execution by cheap. Cheap never selects scope, changes the TS,
    accepts a branch, or decides an architectural or acceptance question.
  analysis: cheapest tier that can carry the search or inspection; verify every cited fact.
  refactoring: cheapest tier for mechanical work; verdicts and review stay at the session tier.

tiers:
  order: [cheap, medium, strong, strongest]
  cheap:
    id: gpt-5.6-terra
    reasoning_effort: medium
    relative_cost: 1x
    fits: one clarified narrow AS whose target is exactly one project file.
  medium:
    id: gpt-5.6-terra
    reasoning_effort: xhigh
    relative_cost: 2x
    fits: >-
      Authors/refines TS, owns formal branch acceptance, and verifies a cheap AS result.
  strong:
    id: gpt-5.6-sol
    reasoning_effort: max
    relative_cost: 4x
    fits: >-
      The next promotion tier for the unchanged clarified scope after medium fails.
  strongest:
    id: gpt-5.6-sol
    reasoning_effort: ultra
    relative_cost: 8x
    fits: >-
      Final Codex promotion tier; its failure escalates upward with the unchanged clarified scope.

selection_rule:
  - medium authors/refines every TS and owns its branch's formal acceptance
  - cheap executes only one clarified narrow AS targeting exactly one project file
  - on the first verified defect, return evidence and give that tier exactly one strict clarified retry
  - if the clarified retry fails, give the same clarified scope to the next more-expensive tier
  - repeat one strict clarified retry and then one-tier promotion after every promoted failure
  - never widen, repartition, or change the target file during retry or promotion; strongest-tier failure escalates upward

zero_trust:
  law: >-
    Output from a cheaper tier is a claim, not a fact. The stage that delegated the work owns
    the verification and the consequences of accepting it.
  required_checks:
    - read the files a cheap-tier result cites before repeating its conclusion
    - re-run any command whose result is being reported as a pass
    - treat "found nothing" from a cheap tier as unverified until the search is reproduced
    - never forward a cheap-tier summary to the user as an established finding
  never_delegate_downward:
    - the `tester` pass/fail verdict
    - the `conscience` final review
    - any acceptance gate or delivery decision
    - the choice of what the task is

acceptance:
  semantic_score: advisory and diagnostic only; it never accepts a branch.
  final_gate: >-
    An independent manual adversarial review is the final veto. The medium TS owner may formally
    accept only after mechanical checks pass and no negative review remains.

false_economy_guard: >-
  If verifying a cheap-tier result costs more attention than doing the work at the higher tier,
  the cheap tier was the wrong choice. Say so plainly and move up; do not defend the choice by
  skipping verification.
