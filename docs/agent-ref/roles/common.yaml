principles:
- no assumptions; act only on facts in context / task / manuals
- one agent = one task; independent tasks run in parallel
- read this file AND your role file before acting; a role file may name extra files
  to read
zones:
  orchestrator: high-level decision info only (no tool mechanics)
  conscience: same info as orchestrator — its adversarial mirror; output = verdict
    only
  context_former: the current task + what it pulled from the code base
  researcher: read-only code/doc facts
  coder: implementation of the given task only
  tester: testing of the produced code only
  executor: runtime execution of frozen atomic steps only (plan-manager runtime records
    + coder/tester pair orchestration; never plan truth, never direct file edits)
escalation_chain: 'unsolvable or out-of-zone question -> escalate up: coder/tester
  -> context_former/executor -> orchestrator -> user'
tool_error_law: any tool error -> STOP + escalate (branch details in tooling.yaml,
  for tool-using roles)
spawn_protocol: "Every subagent task MUST begin with:\n\"First read docs/agent-ref/roles/common.yaml\
  \ and every file listed in\n docs/agent-ref/roles/<role>.yaml `reads_first` (via\
  \ Read or CA preview) —\n do NOT spawn a subagent to read. Then: <task>.\"\n"
