meta:
  project_id: 03d7a632-fae5-4290-bcee-ba84d19dc1c9
  mcp_tool: mcp__claude_ai_MCP-Proxy__call_server
  servers:
    ca: code-analysis-server
    editor: ai-editor-server
ca_commands:
  session_create:
    server: code-analysis-server
    params: {}
    returns:
      session_id: <uuid>
    note: Call first. Reuse session_id for all subsequent editor calls.
  list_project_files:
    server: code-analysis-server
    params:
      project_id: <uuid>
      file_pattern: lmrs/*.py
      page_size: 50
    returns:
      items:
      - file_path: null
        file_id: null
  get_file_lines:
    server: code-analysis-server
    params:
      project_id: <uuid>
      file_path: lmrs/contracts.py
      start_line: 1
      end_line: 50
    returns:
      lines:
      - '...'
      total_lines: N
    note: Read-only. Use to inspect file content without opening an editor session.
  universal_file_preview:
    server: code-analysis-server
    params:
      project_id: <uuid>
      file_path: lmrs/contracts.py
      node_ref: ''
    returns:
      nodes:
      - short_id: null
        kind: null
        name: null
        '...': null
    note: One-shot preview (no lock). Returns short_id integers for nodes.
  search:
    server: code-analysis-server
    params:
      project_id: <uuid>
      query: class AdapterExposure
      enable_semantic: false
      enable_grep: true
      file_pattern: lmrs/
    returns:
      items:
      - '...'
      has_more: null
      job_id: null
    note: Use search_get_page(job_id, block_position=2) for next pages.
  file_structure:
    server: code-analysis-server
    params:
      project_id: <uuid>
      file_path: lmrs/contracts.py
    returns:
      classes:
      - '...'
      functions:
      - '...'
  lint_code:
    server: code-analysis-server
    params:
      project_id: <uuid>
      file_path: lmrs/contracts.py
    returns:
      success: bool
      errors:
      - '...'
      error_count: N
    pass_condition: success == true AND error_count == 0
  type_check_code:
    server: code-analysis-server
    params:
      project_id: <uuid>
      file_path: lmrs/contracts.py
    returns:
      success: bool
      errors:
      - '...'
      error_count: N
    pass_condition: success == true AND error_count == 0
  run_project_module:
    server: code-analysis-server
    params:
      project_id: <uuid>
      module: lmrs.contracts
      timeout_seconds: 30
    returns:
      returncode: N
      stdout: null
      stderr: null
      timed_out: null
    pass_condition: returncode == 0
    note: Module name only, not file path. Tests importability.
  fs_move:
    server: code-analysis-server
    params:
      project_id: <uuid>
      source_path: calibration.py
      dest_path: lmrs/calibration.py
    note: Use to move/rename files within project. Updates version history.
  fs_remove:
    server: code-analysis-server
    params:
      project_id: <uuid>
      file_path: old_file.py
      backup: true
editor_commands:
  universal_file_open:
    server: ai-editor-server
    params_existing:
      project_id: <uuid>
      file_path: lmrs/contracts.py
      session_id: <ca-session-id>
    params_new:
      project_id: <uuid>
      file_path: lmrs/new_file.py
      session_id: <ca-session-id>
      create: true
      initial_content: '# file content as single string with \n'
    returns:
      format_group: null
      draft_path: null
      multi_file_bundle: null
    errors:
    - FILE_ALREADY_OPEN
    - OPEN_ERROR
    - SESSION_NOT_FOUND
    - UNKNOWN_FORMAT
    note: 'For .py files: format_group = "sidecar"

      For .yaml/.yml/.json: format_group = "tree-temp"

      For .md/.txt: format_group = "text"

      For unknown extensions: pass format_group explicitly.

      '
  universal_file_preview:
    server: ai-editor-server
    params:
      project_id: <uuid>
      file_path: lmrs/contracts.py
      session_id: <ca-session-id>
      node_ref: ''
    returns: "nodes list, each with:\n  short_id: integer (use as string in edit operations)\n\
      \  kind: \"class\" | \"function\" | \"import\" | ...\n  name: \"ClassName\"\
      \ | \"function_name\"\n"
    note: 'Re-preview after every edit before targeting node_refs.

      short_id values change after edits — always re-preview.

      '
  universal_file_edit:
    server: ai-editor-server
    params:
      project_id: <uuid>
      session_id: <ca-session-id>
      operations: []
    note: Mutates draft only. CA file unchanged until commit.
  universal_file_write:
    server: ai-editor-server
    params_preview:
      project_id: <uuid>
      session_id: <ca-session-id>
      file_path: lmrs/contracts.py
      write_mode: preview
    returns_preview:
      diff: '...'
    params_commit:
      project_id: <uuid>
      session_id: <ca-session-id>
      file_path: lmrs/contracts.py
      write_mode: commit
    returns_commit:
      uploaded: true
    errors:
    - VALIDATION_ERROR
    note: 'ALWAYS call write(preview) before write(commit) in same session.

      If VALIDATION_ERROR: fix via edit → write(preview) → write(commit).

      uploaded:true is REQUIRED to confirm success.

      '
  universal_file_close:
    server: ai-editor-server
    params:
      project_id: <uuid>
      session_id: <ca-session-id>
    note: ALWAYS call, including after errors. Releases CA lock.
operations:
  python_insert_after:
    type: insert
    target_node_id: '5'
    position: after
    code_lines:
    - ''
    - 'def new_function() -> None:'
    - '    pass'
  python_replace_node:
    type: replace
    node_id: '3'
    code_lines:
    - 'class Updated:'
    - '    pass'
  yaml_replace_value:
    type: replace
    node_ref: '12'
    value: done
  yaml_replace_by_pointer:
    type: replace
    json_pointer: /status
    value: done
patterns:
  CREATE_FILE:
    steps:
      '1': 'CA: session_create → session_id'
      '2': 'Editor: open(create=true, initial_content=<full content>)'
      '3': 'Editor: write(preview) → check diff'
      '4': 'Editor: write(commit) → check uploaded:true'
      '5': 'Editor: close'
      '6': 'CA: run_project_module, lint_code, type_check_code → all pass'
      '7': MARK_YAML_DONE
  MODIFY_APPEND:
    description: Add code after the last node in file
    steps:
      '1': 'CA: session_create → session_id'
      '2': 'Editor: open(file_path)'
      '3': 'Editor: preview(node_ref='''') → find last node short_id'
      '4': 'Editor: edit([{type:insert, target_node_id:<last>, position:after, code_lines:[...]}])'
      '5': 'Editor: write(preview) → verify diff'
      '6': 'Editor: write(commit) → check uploaded:true'
      '7': 'Editor: close'
      '8': 'CA: run_project_module, lint_code, type_check_code → all pass'
      '9': MARK_YAML_DONE
  MODIFY_REPLACE_NODE:
    description: Replace an existing node (e.g. update a class with new methods)
    steps:
      '1': 'CA: session_create → session_id'
      '2': 'Editor: open(file_path)'
      '3': 'Editor: preview(node_ref='''') → find target node short_id'
      '4': 'Editor: edit([{type:replace, node_id:<target>, code_lines:[...]}])'
      '5': 'Editor: write(preview) → verify diff'
      '6': 'Editor: write(commit) → check uploaded:true'
      '7': 'Editor: close'
      '8': 'CA: run_project_module, lint_code, type_check_code → all pass'
      '9': MARK_YAML_DONE
  MARK_YAML_DONE:
    description: Mark an atomic step YAML file status field as done
    steps:
      '1': 'CA: session_create → session_id'
      '2': 'Editor: open(file_path=<yaml path>)'
      '3': 'Editor: preview(node_ref='''') → find ''status'' field node short_id'
      '4': 'Editor: edit([{type:replace, node_ref:<short_id>, value:''done''}])'
      '5': 'Editor: write(preview)'
      '6': 'Editor: write(commit) → check uploaded:true'
      '7': 'Editor: close'
  READ_FILE:
    description: Read file content without locking (inspection only)
    steps:
      '1': 'CA: get_file_lines(project_id, file_path, start_line, end_line)'
      note: No session needed. Use for reading YAMLs, checking current state.
quality_gate:
  required_checks:
  - command: run_project_module
    params:
      project_id: <uuid>
      module: <module_name>
    pass: returncode == 0
  - command: lint_code
    params:
      project_id: <uuid>
      file_path: <file>
    pass: success == true
  - command: type_check_code
    params:
      project_id: <uuid>
      file_path: <file>
    pass: success == true
  on_failure: STOP. Report exact error + step + command. Do NOT proceed.
docstring_standard:
  origin: user directive 2026-07-20, MANDATORY — commit gate enforces this with zero
    tolerance
  required_always:
    module: every .py file starts with a module docstring describing the file's overall
      purpose
    module_functions: every module-level function has a docstring describing its purpose
    classes: every class has a docstring describing its purpose
    methods: every class method has a docstring describing its purpose
    module_variables: every module-level variable carries documentation describing
      its purpose (docstring line or trailing doc-comment)
  content_rule: 'a docstring states the PURPOSE of the object (what it is for), never
    merely restates its name; Google style; include Args/Returns/Raises sections where
    applicable; the SIGNATURE and the docstring together must describe IN DETAIL both
    the TYPE and the PURPOSE of every object involved: full type annotations on all
    parameters and the return value in the signature, and per-parameter/return type
    + purpose descriptions in the docstring'
  signature_rule: method/function signatures carry complete type annotations (every
    parameter and the return type); the docstring's Args/Returns entries repeat the
    type and explain the purpose — signature and docstring must agree
  gate: the editor commit gate hard-blocks on missing docstrings, missing Returns
    sections, and missing return-type hints — fix by writing real documentation, never
    by bypass (see laws.editor_gate_no_bypass)
  forbidden: placeholder docstrings remain forbidden (see forbidden section)
forbidden:
- Using bash/shell commands to read or modify project files
- Using local Read/Write/Edit tools on project files
- write(commit) without preceding write(preview) in same session
- Reusing node short_ids after an edit without re-preview
- '# noqa, # type: ignore, placeholder docstrings, weakening to Any'
- Skipping quality gate
- Silently retrying on error without reporting
- 'Editing immutable files: docs/plans/source_spec.md, docs/plans/spec.yaml, **/README.yaml'
- 'Touching read-only projects: mcp_proxy_adapter, model_access_core, vast_srv'
error_recovery:
  VALIDATION_ERROR:
    action: fix via edit → write(preview) → write(commit); DO NOT close and reopen
  UPSTREAM_UPLOAD_FAILED:
    action: STOP. Report. Do not retry blindly.
  FILE_ALREADY_OPEN:
    action: Another session holds lock. Wait or use session_list to inspect.
  uploaded_missing_from_commit:
    action: STOP. uploaded:true is REQUIRED. Report.
  SESSION_NOT_FOUND:
    action: Session expired. Create new session, reopen file from scratch.
