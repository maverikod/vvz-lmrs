prompt: Create lmrs/cli/operations.py and define CliCommandWrapper as a local operator
  wrapper contract that exposes the main LMRS user-facing and operator-facing commands
  behind a scriptable command-line interface. Each wrapper calls the canonical command
  contracts used by the adapter-facing thin command layer and must not re-implement
  command business logic; it is a local surface over existing command implementation.
  Provide a stable command_name and an invoke method that delegates to the canonical
  command contract. Do not add help rendering or server management here.
