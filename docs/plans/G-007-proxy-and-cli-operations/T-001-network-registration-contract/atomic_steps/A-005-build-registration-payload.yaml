prompt: Modify lmrs/proxy/registration.py after A-001 through A-004. Append 
  build_registration_payload(endpoint, advertised_url) that assembles the 
  registration payload sent to the MCP proxy during registration and heartbeat. 
  It resolves the server name by preferring an explicit server identifier, then 
  an explicit server name, then a deterministic default from normalized host and
  port. It includes the reachable advertised URL, capabilities, and metadata 
  where metadata includes server protocol, host, port, stable instance UUID when
  available, and adapter-specific discovery or routing metadata. Return the 
  payload mapping. Do not perform the network call here.
