prompt: 'Create lmrs/adapter/schemas.py and define CommandSchemaContract as the per-command
  request/result/error schema contract. It declares three schema providers: a request
  schema (returned by get_schema), a result schema (returned by get_result_schema),
  and an error schema (returned by get_error_schema). Schemas live separately from
  executor code and are used by adapter schema-based validation before domain checks.
  Do not add metadata or help fields in this step.'
