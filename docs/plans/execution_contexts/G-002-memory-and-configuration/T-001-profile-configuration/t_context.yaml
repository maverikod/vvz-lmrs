tactical_step_spec:
  step_id: T-001
  parent_global_step: G-002
  name: Profile and Configuration Facts
  description: 'Create the profile and configuration fact model: define Model Profile (C-005), Hardware Profile (C-006), Runtime Configuration (C-021), Model KV Memory Profile (C-045), and KV Cache Byte Formula (C-044) as the configuration-owned facts that downstream capacity logic consumes.'
  concepts:
  - C-005
  - C-006
  - C-021
  - C-044
  - C-045
  inputs:
  - name: profile_claims
    type: source_labels
    description: Binding claims {mdl1}, {hw01}, {cfg1}, {kvf1}, and {ctxb} defining model parameters, hardware parameters, configuration ownership, and KV byte formulas.
  - name: profile_relations
    type: relation_set
    description: Relations C-021 owns C-005, C-021 owns C-006, C-021 owns C-045, C-005 owns C-045, and C-045 uses C-044.
  outputs:
  - name: profile_fact_schema
    type: data_schema
    description: A domain schema for model, hardware, runtime configuration, KV profile parameters, and derived KV byte facts.
  - name: configuration_ownership_rules
    type: ownership_rule_set
    description: Rules stating which profile facts are owned by runtime configuration and how they are made available to capacity calculations.
  atomic_steps:
  - A-001
  - A-002
  - A-003
  - A-004
  - A-005
  - A-006
  - A-007
  status: draft
hrs_mrs_excerpts:
- concept_id: C-005
  name: Model Profile
  definition: A model-specific runtime description that makes LMRS independent from any one local model.
  properties:
  - It includes model_name, runtime backend, path or endpoint, declared context window, tokenizer profile, load policy, KV-cache profile, and concurrency policy.
  - Qwen, Ollama models, GPT-OSS, and other local models are instances described by profiles.
  source_labels:
  - '{mdl1}'
- concept_id: C-006
  name: Hardware Profile
  definition: The hardware capacity description used for admission and calibration decisions.
  properties:
  - The initial target profile is one GPU with 24 GB VRAM and 128 GB RAM.
  - The architecture must allow future larger VRAM cards and multiple GPUs without changing the external provider contract.
  source_labels:
  - '{hw01}'
- concept_id: C-021
  name: Runtime Configuration
  definition: The service configuration that defines hardware, resident services, safety reserves, model profiles, runtime backend, tokenizer, queue policy, and queue limits.
  properties:
  - Configuration includes hardware profile, resident services, safety margin, runtime reserve, models, runtime backend, tokenizer profile, queue policy, and queue limits.
  - For vLLM, configuration includes LMCache enablement, cache storage path, policy, limits, eviction policy, namespace/session binding, and compatibility mode with model profile.
  source_labels:
  - '{cfg1}'
  - '{lmcache3}'
- concept_id: C-044
  name: KV Cache Byte Formula
  definition: Formula contract for computing worst-case KV-cache byte usage from request tokens and explicit model/runtime parameters.
  properties:
    formula: kv_bytes = tokens * layers * 2 * kv_heads * head_dim * kv_element_bytes
    key_value_factor: 2
    derived_facts:
    - kv_bytes_per_token = layers * 2 * kv_heads * head_dim * kv_element_bytes
    - kv_full_window_bytes = declared_context_window * kv_bytes_per_token
    scope: Used for model profile facts, request estimates, and full-window capacity calculations.
  source_labels:
  - '{kvf1}'
  - '{ctxb}'
- concept_id: C-045
  name: Model KV Memory Profile
  definition: Derived memory profile that stores KV-cache parameters, runtime KV dtype, bytes per token, and full-window byte cost for a concrete model profile.
  properties:
    required_parameters:
    - layers
    - kv_heads
    - head_dim
    - kv_element_bytes
    - declared_context_window
    quantization_rule: Weight quantization such as Q8 or K8 does not reduce KV-cache bytes unless the runtime explicitly uses a reduced KV-cache element dtype.
    example_qwen3_profile:
      layers: 48
      kv_heads: 4
      head_dim: 128
      kv_element_bytes: 2
      context_40960_bytes: 4026531840
      context_32768_bytes: 3221225472
    one_byte_kv_rule: If runtime KV elements are one byte, KV-cache byte cost is halved.
  source_labels:
  - '{ctxb}'
  - '{mdl1}'
