atomic_step_spec:
  step_id: A-001
  parent_tactical_step: T-001
  name: Define HardwareProfile
  target_file: lmrs/configuration.py
  operation: create_file
  priority: 1
  depends_on: []
  concepts:
  - C-006
  objects:
  - HardwareProfile
  prompt: "Target file: lmrs/configuration.py\nOperation: create_file\n\nMRS excerpt:\n- C-006 Hardware Profile: hardware capacity description used for admission and calibration decisions. Initial target is one GPU with 24 GB VRAM and 128 GB RAM. Architecture must allow larger cards and multiple GPUs without changing the external provider contract.\n\nCreate lmrs/configuration.py with exactly this content:\n```python\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom typing import Mapping\n\n\n@dataclass(frozen=True)\nclass HardwareProfile:\n    \"\"\"Hardware capacity profile used by LMRS admission and calibration logic.\"\"\"\n\n    gpu_count: int = 1\n    total_vram_bytes: int = 24 * 1024**3\n    total_ram_bytes: int = 128 * 1024**3\n    gpu_model: str | None = None\n    metadata: Mapping[str, str] = field(default_factory=dict)\n```\n\nConstraints:\n- Use exactly the imports shown.\n- HardwareProfile must be frozen.\n- Do not add model, KV, runtime configuration,\
    \ or validation objects in this step."
  verification: &id001
    type: static_analysis
    target: lmrs/configuration.py::HardwareProfile
    expected: The file defines a frozen HardwareProfile dataclass with GPU count, VRAM bytes, RAM bytes, optional GPU model, and metadata fields.
  status: done
