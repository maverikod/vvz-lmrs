atomic_step_spec:
  step_id: A-003
  parent_tactical_step: T-003
  name: Define CalibrationProfile
  target_file: lmrs/calibration.py
  operation: modify_file
  priority: 3
  depends_on:
  - A-002
  concepts:
  - C-020
  objects:
  - CalibrationProfile
  prompt: 'Modify lmrs/calibration.py after A-001 and A-002. Append frozen dataclass CalibrationProfile with key: CalibrationKey, kv_bytes_per_token: int, per_request_overhead_bytes: int, runtime_batch_overhead_bytes: int, observation_count: int, source: str = ''empirical'', valid: bool = True, invalidation_reason: str | None = None, and metadata Mapping[str, str] default empty. It must represent calibrated KV and overhead costs and invalidation state. Do not add builder or snapshot function.'
  verification: &id001
    type: static_analysis
    target: lmrs/calibration.py::CalibrationProfile
    expected: Frozen CalibrationProfile dataclass stores calibrated KV cost, overhead costs, observation count, validity, invalidation reason, and metadata.
  status: done
hrs_mrs_excerpts:
- concept_id: C-020
  name: Calibration Profile
  definition: The model, runtime, quantization, and hardware-specific calibration data for estimating KV-cache and overhead costs.
  properties:
  - KV-cache cost per token supports empirical calibration.
  - The preferred calibration method measures VRAM growth across prompt lengths.
  - Calibration profiles are bound to model, runtime backend, quantization/profile, and hardware profile.
  - Changing model, runtime, or GPU invalidates or requires renewing the calibration profile.
  source_labels:
  - '{cal1}'
  - '{cal2}'
