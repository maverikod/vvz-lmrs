tactical_step_spec:
  step_id: T-003
  parent_global_step: G-002
  name: Calibration Feedback Contract
  description: 'Create the calibration feedback contract: define Calibration Profile (C-020) as the domain object that stores empirical KV-cache and overhead observations and supplies corrected facts to Request Capacity Estimate (C-011) without owning request admission or runtime execution.'
  concepts:
  - C-020
  - C-011
  inputs:
  - name: calibration_claims
    type: source_labels
    description: Binding claims {cal1} and {cal2} defining empirical calibration and profile invalidation conditions.
  - name: telemetry_observations
    type: telemetry_fact_set
    description: Observed runtime token, VRAM, and overhead facts consumed by calibration without redefining Telemetry (C-019).
  outputs:
  - name: calibration_profile_contract
    type: domain_contract
    description: A contract for storing calibrated KV and overhead costs by model, runtime, quantization/profile, and hardware profile.
  - name: capacity_estimate_adjustment
    type: calibration_output
    description: Corrected estimate inputs made available to Request Capacity Estimate (C-011).
  atomic_steps:
  - A-001
  - A-002
  - A-003
  - A-004
  - A-005
  status: draft
hrs_mrs_excerpts:
- concept_id: C-011
  name: Request Capacity Estimate
  definition: The computed token and dynamic VRAM requirement for an individual request.
  properties:
  - required_tokens includes input tokens, tool tokens, service tokens, and reserved output tokens.
  - Requests exceeding the declared model context window are rejected.
  - Dynamic VRAM estimate is based on required_tokens, calibrated KV-cache cost per token, and per-request overhead.
  - Allowed request size is the minimum of declared context window and dynamic-pool token capacity.
  source_labels:
  - '{lim1}'
  - '{lim2}'
  - '{lim3}'
- concept_id: C-020
  name: Calibration Profile
  definition: The model, runtime, quantization, and hardware-specific calibration data for estimating KV-cache and overhead costs.
  properties:
  - KV-cache cost per token supports empirical calibration.
  - The preferred calibration method measures VRAM growth across prompt lengths.
  - Calibration profiles are bound to model, runtime backend, quantization/profile, and hardware profile.
  - Changing model, runtime, or GPU invalidates or requires renewing the calibration profile.
  source_labels:
  - '{cal1}'
  - '{cal2}'
