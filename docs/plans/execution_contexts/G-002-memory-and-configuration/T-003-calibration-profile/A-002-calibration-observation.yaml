atomic_step_spec:
  step_id: A-002
  parent_tactical_step: T-003
  name: Define CalibrationObservation
  target_file: lmrs/calibration.py
  operation: modify_file
  priority: 2
  depends_on:
  - A-001
  concepts:
  - C-020
  - C-011
  objects:
  - CalibrationObservation
  prompt: Modify lmrs/calibration.py after A-001. Append frozen dataclass CalibrationObservation with measured prompt_tokens, output_tokens, predicted_dynamic_vram_bytes, actual_dynamic_vram_bytes, per_request_overhead_bytes default 0, runtime_batch_overhead_bytes default 0, and metadata Mapping[str, str] default empty. The object records empirical observations consumed by capacity estimation calibration. Do not add profile aggregation or admission logic.
  verification: &id001
    type: static_analysis
    target: lmrs/calibration.py::CalibrationObservation
    expected: Frozen CalibrationObservation dataclass stores empirical token, predicted VRAM, actual VRAM, and overhead facts for calibration.
  status: done
hrs_mrs_excerpts:
- concept_id: C-011
  name: Request Capacity Estimate
  definition: The computed token and dynamic VRAM requirement for an individual request.
  properties:
  - required_tokens includes input tokens, tool tokens, service tokens, and reserved output tokens.
  - Requests exceeding the declared model context window are rejected.
  - Dynamic VRAM estimate is based on required_tokens, calibrated KV-cache cost per token, and per-request overhead.
  - Allowed request size is the minimum of declared context window and dynamic-pool token capacity.
  source_labels:
  - '{lim1}'
  - '{lim2}'
  - '{lim3}'
- concept_id: C-020
  name: Calibration Profile
  definition: The model, runtime, quantization, and hardware-specific calibration data for estimating KV-cache and overhead costs.
  properties:
  - KV-cache cost per token supports empirical calibration.
  - The preferred calibration method measures VRAM growth across prompt lengths.
  - Calibration profiles are bound to model, runtime backend, quantization/profile, and hardware profile.
  - Changing model, runtime, or GPU invalidates or requires renewing the calibration profile.
  source_labels:
  - '{cal1}'
  - '{cal2}'
