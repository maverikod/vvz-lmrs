hrs_mrs_excerpts:
- concept_id: C-009
  name: Dynamic VRAM Pool
  definition: The remaining VRAM capacity available for KV-cache, runtime buffers, batching overhead, and active request reservations after resident services and model static memory.
  properties:
  - Maximum dynamic pool is computed from free VRAM after model load minus safety margin and runtime reserve.
  - Current dynamic pool additionally subtracts active request reservations.
  - The dynamic pool bounds whether requests execute immediately, queue, or reject.
  source_labels:
  - '{dyn1}'
  - '{dyn2}'
  - '{lim3}'
- concept_id: C-046
  name: Usable Dynamic VRAM Formula
  definition: Runtime formula for the currently usable GPU dynamic memory pool after model load, safety margin, runtime reserve, and active request reservations.
  properties:
    formula: usable_dynamic_vram_bytes = model_loaded_free_vram_bytes - safety_margin_bytes - runtime_reserve_bytes - active_reservation_bytes
    active_reservation_bytes: Sum of reservations held by running requests.
    admission_rule: Admission and scheduling use current usable dynamic VRAM, not total VRAM, total RAM, disk cache size, or LMCache capacity.
  source_labels:
  - '{vram1}'
