  - A-001
  - A-002
  - A-003
  - A-004
  - A-005
  - A-006
  status: draft
hrs_mrs_excerpts:
- concept_id: C-007
  name: Resident GPU Services Baseline
  definition: The measured GPU baseline after always-on GPU resident services are running and before the main LLM is loaded.
  properties:
  - Resident services may include vectorizer, chunker, CUDA/runtime buffers, and other always-on processes.
  - The baseline is not an empty GPU state.
  - The service measures service_baseline_free_vram at start or calibration.
  source_labels:
  - '{base}'
  - '{mem1}'
- concept_id: C-008
  name: VRAM Runtime Facts
  definition: Measured runtime facts describing baseline free VRAM, model-loaded free VRAM, measured model static VRAM, and dynamic pool capacity.
  properties:
  - model_loaded_free_vram is measured after loading the local model.
  - measured_model_static_vram is the difference between service_baseline_free_vram and model_loaded_free_vram.
  - Measured static VRAM is stored for model_name, runtime, quantization/profile, and hardware_profile.
  - Runtime facts must not be replaced by purely theoretical assumptions.
  source_labels:
  - '{load}'
  - '{stat}'
  - '{inv3}'
- concept_id: C-009
  name: Dynamic VRAM Pool
  definition: The remaining VRAM capacity available for KV-cache, runtime buffers, batching overhead, and active request reservations after resident services and model static memory.
  properties:
  - Maximum dynamic pool is computed from free VRAM after model load minus safety margin and runtime reserve.
  - Current dynamic pool additionally subtracts active request reservations.
  - The dynamic pool bounds whether requests execute immediately, queue, or reject.
  source_labels:
  - '{dyn1}'
  - '{dyn2}'
  - '{lim3}'
- concept_id: C-046
  name: Usable Dynamic VRAM Formula
  definition: Runtime formula for the currently usable GPU dynamic memory pool after model load, safety margin, runtime reserve, and active request reservations.
  properties:
    formula: usable_dynamic_vram_bytes = model_loaded_free_vram_bytes - safety_margin_bytes - runtime_reserve_bytes - active_reservation_bytes
    active_reservation_bytes: Sum of reservations held by running requests.
    admission_rule: Admission and scheduling use current usable dynamic VRAM, not total VRAM, total RAM, disk cache size, or LMCache capacity.
  source_labels:
  - '{vram1}'
