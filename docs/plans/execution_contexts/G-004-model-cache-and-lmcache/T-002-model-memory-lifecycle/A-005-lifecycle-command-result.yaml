hrs_mrs_excerpts:
- concept_id: C-008
  name: VRAM Runtime Facts
  definition: Measured runtime facts describing baseline free VRAM, model-loaded free VRAM, measured model static VRAM, and dynamic pool capacity.
  properties:
  - model_loaded_free_vram is measured after loading the local model.
  - measured_model_static_vram is the difference between service_baseline_free_vram and model_loaded_free_vram.
  - Measured static VRAM is stored for model_name, runtime, quantization/profile, and hardware_profile.
  - Runtime facts must not be replaced by purely theoretical assumptions.
  source_labels:
  - '{load}'
  - '{stat}'
  - '{inv3}'
- concept_id: C-017
  name: Public Command Contract
  definition: The minimum stable command surface exposed by LMRS for health, capacity, admission, chat, queue, cache, and model lifecycle operations.
  properties:
  - The minimal runtime command set includes healthcheck, model status, capacity, token counting, dry-run estimate/admission, chat request, queue status, and request cancellation.
  - The estimate command performs dry-run admission and returns would_execute, would_queue, or would_reject with reason code, token breakdown, and capacity snapshot.
  - The chat command performs token counting and admission, then returns executed, queued, or rejected with the appropriate result, queue state, or stable reason code.
  - Additional cache and memory commands include local_model_cache_preload, local_model_cache_status, local_model_cache_delete, local_model_load, local_model_unload, and local_model_reload.
  source_labels:
  - '{cmd1}'
  - '{cmd2}'
  - '{cmd3}'
  - '{cmd4}'
  - '{dcache3}'
  - '{mlife2}'
- concept_id: C-024
  name: Model Memory Lifecycle
  definition: The lifecycle that explicitly loads, unloads, reloads, and reports model residency in memory independently from disk cache availability.
  properties:
  - Loading to memory is separate from disk cache preload.
  - Lifecycle commands include load_model, unload_model, reload_model, model_status, and model_lifecycle_status.
  - Before loading, the service verifies disk cache presence and runtime compatibility or returns MODEL_NOT_CACHED unless preload is explicitly allowed.
  - After loading, the service measures model_loaded_free_vram and records measured_model_static_vram.
  - Unloading frees VRAM residency without requiring disk cache deletion and updates free VRAM state.
  - The MVP policy is keep_loaded for one resident LLM until explicit unload or replacement.
  source_labels:
  - '{mlife1}'
  - '{mlife2}'
  - '{mlife3}'
  - '{mlife4}'
  - '{mlife5}'
  - '{mlife6}'
  - '{inv4}'
