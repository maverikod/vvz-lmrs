hrs_mrs_excerpts:
- concept_id: C-024
  name: Model Memory Lifecycle
  definition: The lifecycle that explicitly loads, unloads, reloads, and reports model residency in memory independently from disk cache availability.
  properties:
  - Loading to memory is separate from disk cache preload.
  - Lifecycle commands include load_model, unload_model, reload_model, model_status, and model_lifecycle_status.
  - Before loading, the service verifies disk cache presence and runtime compatibility or returns MODEL_NOT_CACHED unless preload is explicitly allowed.
  - After loading, the service measures model_loaded_free_vram and records measured_model_static_vram.
  - Unloading frees VRAM residency without requiring disk cache deletion and updates free VRAM state.
  - The MVP policy is keep_loaded for one resident LLM until explicit unload or replacement.
  source_labels:
