    type: source_labels
    description: Binding claims {mlife1}, {mlife2}, {mlife3}, {mlife4}, {mlife5}, {mlife6}, and {inv4} defining memory residency lifecycle.
  - name: disk_cache_state
    type: cache_status
    description: Disk model cache status consumed before memory load operations.
  outputs:
  - name: memory_lifecycle_state_contract
    type: state_machine_contract
    description: A lifecycle contract for not loaded, loading, loaded, unloading, reload, failed, and keep-loaded states.
  - name: model_load_vram_fact_update
