  name: Model Memory Lifecycle
  description: 'Create the model memory lifecycle contract: use Model Memory Lifecycle (C-024), Disk Model Cache (C-023), and VRAM Runtime Facts (C-008) to define load, unload, reload, resident status, measured static VRAM, and post-operation VRAM fact updates.'
