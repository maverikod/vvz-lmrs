atomic_step_spec:
  step_id: A-005
  parent_tactical_step: T-003
  name: Implement build_lmcache_telemetry
  target_file: lmrs/lmcache.py
  operation: modify_file
  priority: 5
  depends_on:
  - A-004
  concepts:
  - C-049
  - C-019
  - C-015
  objects:
  - build_lmcache_telemetry
  prompt: Modify lmrs/lmcache.py after A-001 through A-004. Append build_lmcache_telemetry(policy, observations) -> LMCacheTelemetry that consumes the LMCacheStoragePolicy and a mapping of runtime backend observations and assembles an LMCacheTelemetry record with hit/miss tokens, hit quality, restore and write latency, CPU and disk usage, evictions, memory pressure, and swap indicators. It reports observed facts only and must not weaken admission or count cache storage as free VRAM.
  verification: &id001
    type: static_analysis
    target: lmrs/lmcache.py::build_lmcache_telemetry
    expected: Function assembles an LMCacheTelemetry record from policy and runtime observations without altering admission or VRAM accounting.
  status: done
hrs_mrs_excerpts:
- concept_id: C-015
  name: Runtime Backend
  definition: An execution backend abstraction that runs only requests admitted by LMRS.
  properties:
  - Supported backend examples include vLLM, Ollama, llama.cpp, GPT-OSS runtime, or another local runtime.
  - The runtime backend does not make admission decisions.
  source_labels:
  - '{run1}'
- concept_id: C-019
  name: Telemetry
  definition: The observable data emitted and returned by LMRS for debugging, admission traceability, and calibration feedback.
  properties:
  - Telemetry includes predicted tokens, predicted VRAM, actual prompt tokens, actual output tokens, latency, queue wait, VRAM snapshots, admission verdict, and reason code.
  - Telemetry supports calibration of KV-cache cost, per-request overhead, safety margin, and scheduler policy.
  - LMCache telemetry includes hit/miss, reused tokens, new tokens, lookup latency, write latency, eviction events, and impact on actual VRAM and latency.
  source_labels:
  - '{obs1}'
  - '{obs2}'
  - '{lmcache7}'
- concept_id: C-049
  name: LMCache Storage Telemetry
  definition: Telemetry and storage accounting contract that separates LMCache CPU/disk tiers from GPU dynamic VRAM.
  properties:
    storage_tiers:
      ram: Hot KV storage tier.
      disk: Warm or cold KV storage tier.
    separation_rule: CPU and disk LMCache capacity do not count as free VRAM.
    telemetry_fields:
    - hit_tokens
    - miss_tokens
    - hit_quality
    - restore_latency
    - cpu_cache_usage
    - cpu_cache_limit
    - disk_cache_usage
    - disk_cache_limit
    - evictions
    - memory_pressure
    - swap_indicators
    purpose: Tune cache limits without weakening admission safety.
  source_labels:
  - '{lmc2}'
  - '{lmcache7}'
