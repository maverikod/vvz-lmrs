hrs_mrs_excerpts:
- concept_id: C-012
  name: Admission Control
  definition: The pre-queue decision process that classifies requests as executable, queueable, or rejected using context-window and VRAM capacity constraints.
  properties:
  - Admission runs before a request enters the queue.
  - Requests over the model context window are rejected with CONTEXT_OVERFLOW.
  - Requests too large for the maximum dynamic pool are rejected with REQUEST_TOO_LARGE or HARDWARE_VRAM_INSUFFICIENT.
  - Requests that fit the maximum dynamic pool but not current capacity are queued, not permanently rejected.
  - Requests fitting both model window and current dynamic pool may execute immediately or be queued according to scheduler policy.
  - LMCache reuse does not permit unsafe admission.
  source_labels:
  - '{adm1}'
  - '{adm2}'
  - '{adm3}'
  - '{inv1}'
  - '{inv2}'
  - '{lmcache2}'
  - '{lmcache6}'
  - '{inv5}'
- concept_id: C-015
  name: Runtime Backend
  definition: An execution backend abstraction that runs only requests admitted by LMRS.
  properties:
  - Supported backend examples include vLLM, Ollama, llama.cpp, GPT-OSS runtime, or another local runtime.
  - The runtime backend does not make admission decisions.
  source_labels:
  - '{run1}'
- concept_id: C-019
  name: Telemetry
  definition: The observable data emitted and returned by LMRS for debugging, admission traceability, and calibration feedback.
  properties:
  - Telemetry includes predicted tokens, predicted VRAM, actual prompt tokens, actual output tokens, latency, queue wait, VRAM snapshots, admission verdict, and reason code.
  - Telemetry supports calibration of KV-cache cost, per-request overhead, safety margin, and scheduler policy.
  - LMCache telemetry includes hit/miss, reused tokens, new tokens, lookup latency, write latency, eviction events, and impact on actual VRAM and latency.
  source_labels:
  - '{obs1}'
  - '{obs2}'
  - '{lmcache7}'
- concept_id: C-021
  name: Runtime Configuration
  definition: The service configuration that defines hardware, resident services, safety reserves, model profiles, runtime backend, tokenizer, queue policy, and queue limits.
  properties:
  - Configuration includes hardware profile, resident services, safety margin, runtime reserve, models, runtime backend, tokenizer profile, queue policy, and queue limits.
  - For vLLM, configuration includes LMCache enablement, cache storage path, policy, limits, eviction policy, namespace/session binding, and compatibility mode with model profile.
  source_labels:
  - '{cfg1}'
  - '{lmcache3}'
- concept_id: C-025
  name: LMCache Integration
  definition: The vLLM LMCache runtime caching integration used to accelerate reuse of repeated or long context while preserving conservative admission decisions.
  properties:
  - LMCache is a separate runtime/caching backend and does not replace admission control.
  - Disk model cache and LMCache are distinct caches with different artifacts.
  - Estimate responses may include cache_reuse_possible, estimated_cache_hit_tokens, effective_new_tokens, and cache_estimate_quality when pre-execution cache information is available.
  - If a cache hit is not guaranteed before launch, admission estimates the request as a full cache miss.
  source_labels:
  - '{lmcache1}'
  - '{lmcache2}'
  - '{lmcache3}'
  - '{lmcache4}'
  - '{lmcache5}'
  - '{lmcache6}'
  - '{lmcache7}'
  - '{inv5}'
- concept_id: C-049
  name: LMCache Storage Telemetry
  definition: Telemetry and storage accounting contract that separates LMCache CPU/disk tiers from GPU dynamic VRAM.
  properties:
    storage_tiers:
      ram: Hot KV storage tier.
      disk: Warm or cold KV storage tier.
    separation_rule: CPU and disk LMCache capacity do not count as free VRAM.
    telemetry_fields:
    - hit_tokens
    - miss_tokens
    - hit_quality
    - restore_latency
    - cpu_cache_usage
    - cpu_cache_limit
    - disk_cache_usage
    - disk_cache_limit
    - evictions
    - memory_pressure
    - swap_indicators
    purpose: Tune cache limits without weakening admission safety.
  source_labels:
  - '{lmc2}'
  - '{lmcache7}'
