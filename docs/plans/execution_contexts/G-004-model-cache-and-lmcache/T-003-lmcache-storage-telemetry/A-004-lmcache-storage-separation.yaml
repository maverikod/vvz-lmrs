  prompt: 'Modify lmrs/lmcache.py after A-001 through A-003. Append lmcache_storage_separation(usable_dynamic_vram_bytes: int, telemetry: LMCacheTelemetry) -> int. It must return usable_dynamic_vram_bytes unchanged, proving CPU and disk LMCache capacity never count as free GPU VRAM. It must not add cpu_cache_usage or disk_cache_usage to the VRAM pool and must not weaken admission safety.'
