schema_version: lmrs.execution_context.v1
language: en
file_kind: as_context
context_bundle_order:
- ../../../00-common/common_context.yaml
- ../../../00-common/root_orchestrator_task.yaml
- ../../g_context.yaml
- ../t_context.yaml
- ./A-001-lmcache-storage-policy.yaml
role: atomic_step_executor
required_model: gpt-5.3-codex-spark
scope:
  global_step: G-004-model-cache-and-lmcache
  tactical_step: T-003-lmcache-storage-telemetry
  atomic_step: A-001
  source_file: docs/plans/G-004-model-cache-and-lmcache/T-003-lmcache-storage-telemetry/atomic_steps/A-001-lmcache-storage-policy.yaml
  target_file: lmrs/lmcache.py
atomic_step_spec:
  step_id: A-001
  parent_tactical_step: T-003
  name: Define LMCacheStoragePolicy
  target_file: lmrs/lmcache.py
  operation: create_file
  priority: 1
  depends_on: []
  concepts:
  - C-025
  - C-021
  objects:
  - LMCacheStoragePolicy
  prompt: Create lmrs/lmcache.py and define frozen dataclass LMCacheStoragePolicy with enabled bool default False, storage_tiers (ram and disk), cache_storage_path, namespace_binding, session_binding, cpu_cache_limit_bytes, disk_cache_limit_bytes, eviction_policy, compatibility_mode, and metadata. LMCache is a separate caching backend distinct from the disk model cache and does not replace admission control. Do not add telemetry or estimate fields in this step.
  verification: &id001
    type: static_analysis
    target: lmrs/lmcache.py::LMCacheStoragePolicy
    expected: LMCacheStoragePolicy captures enablement, CPU and disk tiers, storage path, namespace/session binding, limits, eviction policy, and runtime/model compatibility, separate from disk model cache.
  status: done
hrs_mrs_excerpts:
- concept_id: C-021
  name: Runtime Configuration
  definition: The service configuration that defines hardware, resident services, safety reserves, model profiles, runtime backend, tokenizer, queue policy, and queue limits.
  properties:
  - Configuration includes hardware profile, resident services, safety margin, runtime reserve, models, runtime backend, tokenizer profile, queue policy, and queue limits.
  - For vLLM, configuration includes LMCache enablement, cache storage path, policy, limits, eviction policy, namespace/session binding, and compatibility mode with model profile.
  source_labels:
  - '{cfg1}'
  - '{lmcache3}'
- concept_id: C-025
  name: LMCache Integration
  definition: The vLLM LMCache runtime caching integration used to accelerate reuse of repeated or long context while preserving conservative admission decisions.
  properties:
  - LMCache is a separate runtime/caching backend and does not replace admission control.
  - Disk model cache and LMCache are distinct caches with different artifacts.
  - Estimate responses may include cache_reuse_possible, estimated_cache_hit_tokens, effective_new_tokens, and cache_estimate_quality when pre-execution cache information is available.
  - If a cache hit is not guaranteed before launch, admission estimates the request as a full cache miss.
  source_labels:
  - '{lmcache1}'
  - '{lmcache2}'
  - '{lmcache3}'
  - '{lmcache4}'
  - '{lmcache5}'
  - '{lmcache6}'
  - '{lmcache7}'
  - '{inv5}'
execution_rules:
  single_target_step: true
  assume_empty_initial_context: true
  use_only_concatenated_context: true
  no_guessing: true
  on_conflict_or_missing_fact: Escalate to the T orchestrator with exact file paths, command outputs, and the decision required.
acceptance:
- *id001
- Report changed files and verification evidence to the T orchestrator.
