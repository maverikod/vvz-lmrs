hrs_mrs_excerpts:
- concept_id: C-005
  name: Model Profile
  definition: A model-specific runtime description that makes LMRS independent from any one local model.
  properties:
  - It includes model_name, runtime backend, path or endpoint, declared context window, tokenizer profile, load policy, KV-cache profile, and concurrency policy.
  - Qwen, Ollama models, GPT-OSS, and other local models are instances described by profiles.
  source_labels:
  - '{mdl1}'
- concept_id: C-008
  name: VRAM Runtime Facts
  definition: Measured runtime facts describing baseline free VRAM, model-loaded free VRAM, measured model static VRAM, and dynamic pool capacity.
  properties:
  - model_loaded_free_vram is measured after loading the local model.
  - measured_model_static_vram is the difference between service_baseline_free_vram and model_loaded_free_vram.
  - Measured static VRAM is stored for model_name, runtime, quantization/profile, and hardware_profile.
  - Runtime facts must not be replaced by purely theoretical assumptions.
  source_labels:
  - '{load}'
  - '{stat}'
  - '{inv3}'
- concept_id: C-012
  name: Admission Control
  definition: The pre-queue decision process that classifies requests as executable, queueable, or rejected using context-window and VRAM capacity constraints.
  properties:
  - Admission runs before a request enters the queue.
  - Requests over the model context window are rejected with CONTEXT_OVERFLOW.
  - Requests too large for the maximum dynamic pool are rejected with REQUEST_TOO_LARGE or HARDWARE_VRAM_INSUFFICIENT.
  - Requests that fit the maximum dynamic pool but not current capacity are queued, not permanently rejected.
  - Requests fitting both model window and current dynamic pool may execute immediately or be queued according to scheduler policy.
  - LMCache reuse does not permit unsafe admission.
  source_labels:
  - '{adm1}'
  - '{adm2}'
  - '{adm3}'
  - '{inv1}'
  - '{inv2}'
  - '{lmcache2}'
  - '{lmcache6}'
  - '{inv5}'
- concept_id: C-015
  name: Runtime Backend
  definition: An execution backend abstraction that runs only requests admitted by LMRS.
  properties:
  - Supported backend examples include vLLM, Ollama, llama.cpp, GPT-OSS runtime, or another local runtime.
  - The runtime backend does not make admission decisions.
  source_labels:
  - '{run1}'
- concept_id: C-017
  name: Public Command Contract
  definition: The minimum stable command surface exposed by LMRS for health, capacity, admission, chat, queue, cache, and model lifecycle operations.
  properties:
  - The minimal runtime command set includes healthcheck, model status, capacity, token counting, dry-run estimate/admission, chat request, queue status, and request cancellation.
  - The estimate command performs dry-run admission and returns would_execute, would_queue, or would_reject with reason code, token breakdown, and capacity snapshot.
  - The chat command performs token counting and admission, then returns executed, queued, or rejected with the appropriate result, queue state, or stable reason code.
  - Additional cache and memory commands include local_model_cache_preload, local_model_cache_status, local_model_cache_delete, local_model_load, local_model_unload, and local_model_reload.
  source_labels:
  - '{cmd1}'
  - '{cmd2}'
  - '{cmd3}'
  - '{cmd4}'
  - '{dcache3}'
  - '{mlife2}'
- concept_id: C-019
  name: Telemetry
  definition: The observable data emitted and returned by LMRS for debugging, admission traceability, and calibration feedback.
  properties:
  - Telemetry includes predicted tokens, predicted VRAM, actual prompt tokens, actual output tokens, latency, queue wait, VRAM snapshots, admission verdict, and reason code.
  - Telemetry supports calibration of KV-cache cost, per-request overhead, safety margin, and scheduler policy.
  - LMCache telemetry includes hit/miss, reused tokens, new tokens, lookup latency, write latency, eviction events, and impact on actual VRAM and latency.
  source_labels:
  - '{obs1}'
  - '{obs2}'
  - '{lmcache7}'
- concept_id: C-021
  name: Runtime Configuration
  definition: The service configuration that defines hardware, resident services, safety reserves, model profiles, runtime backend, tokenizer, queue policy, and queue limits.
  properties:
  - Configuration includes hardware profile, resident services, safety margin, runtime reserve, models, runtime backend, tokenizer profile, queue policy, and queue limits.
  - For vLLM, configuration includes LMCache enablement, cache storage path, policy, limits, eviction policy, namespace/session binding, and compatibility mode with model profile.
  source_labels:
  - '{cfg1}'
  - '{lmcache3}'
- concept_id: C-023
  name: Disk Model Cache
  definition: The disk-resident model cache that stores model weights, tokenizer files, runtime metadata, integrity information, readiness state, and cache profile independently from VRAM residency.
  properties:
  - Preload downloads, verifies integrity, prepares local layout, tokenizer files, runtime metadata, and readiness marker without requiring VRAM load.
  - Disk cache and VRAM model residency are separate states.
  - Model states include not_cached, caching, cached_on_disk, loading_to_memory, loaded_in_memory, unloading, and failed.
  - Cache management commands add, check, delete, list, verify integrity, and update metadata.
  - Cache profile stores model_name, runtime, model_path, quantization/profile, declared_context_window, tokenizer profile, checksum or revision, disk size, load date, compatibility flags, and cache status.
  source_labels:
  - '{dcache1}'
  - '{dcache2}'
  - '{dcache3}'
  - '{dcache4}'
  - '{inv4}'
- concept_id: C-024
  name: Model Memory Lifecycle
  definition: The lifecycle that explicitly loads, unloads, reloads, and reports model residency in memory independently from disk cache availability.
  properties:
  - Loading to memory is separate from disk cache preload.
  - Lifecycle commands include load_model, unload_model, reload_model, model_status, and model_lifecycle_status.
  - Before loading, the service verifies disk cache presence and runtime compatibility or returns MODEL_NOT_CACHED unless preload is explicitly allowed.
  - After loading, the service measures model_loaded_free_vram and records measured_model_static_vram.
  - Unloading frees VRAM residency without requiring disk cache deletion and updates free VRAM state.
  - The MVP policy is keep_loaded for one resident LLM until explicit unload or replacement.
  source_labels:
  - '{mlife1}'
  - '{mlife2}'
  - '{mlife3}'
  - '{mlife4}'
  - '{mlife5}'
  - '{mlife6}'
  - '{inv4}'
- concept_id: C-025
  name: LMCache Integration
  definition: The vLLM LMCache runtime caching integration used to accelerate reuse of repeated or long context while preserving conservative admission decisions.
  properties:
  - LMCache is a separate runtime/caching backend and does not replace admission control.
  - Disk model cache and LMCache are distinct caches with different artifacts.
  - Estimate responses may include cache_reuse_possible, estimated_cache_hit_tokens, effective_new_tokens, and cache_estimate_quality when pre-execution cache information is available.
  - If a cache hit is not guaranteed before launch, admission estimates the request as a full cache miss.
  source_labels:
  - '{lmcache1}'
  - '{lmcache2}'
  - '{lmcache3}'
  - '{lmcache4}'
  - '{lmcache5}'
  - '{lmcache6}'
  - '{lmcache7}'
  - '{inv5}'
- concept_id: C-049
  name: LMCache Storage Telemetry
  definition: Telemetry and storage accounting contract that separates LMCache CPU/disk tiers from GPU dynamic VRAM.
  properties:
    storage_tiers:
      ram: Hot KV storage tier.
      disk: Warm or cold KV storage tier.
    separation_rule: CPU and disk LMCache capacity do not count as free VRAM.
    telemetry_fields:
    - hit_tokens
    - miss_tokens
    - hit_quality
    - restore_latency
    - cpu_cache_usage
    - cpu_cache_limit
    - disk_cache_usage
    - disk_cache_limit
    - evictions
    - memory_pressure
    - swap_indicators
    purpose: Tune cache limits without weakening admission safety.
  source_labels:
  - '{lmc2}'
  - '{lmcache7}'
