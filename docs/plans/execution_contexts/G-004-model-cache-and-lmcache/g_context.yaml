    description: 'Create the model memory lifecycle contract: use Model Memory Lifecycle (C-024), Disk Model Cache (C-023), and VRAM Runtime Facts (C-008) to define load, unload, reload, resident status, measured static VRAM, and post-operation VRAM fact updates.'
    concepts:
    - C-024
    - C-023
    - C-008
    - C-017
    inputs:
    - name: memory_lifecycle_claims
      type: source_labels
      description: Binding claims {mlife1}, {mlife2}, {mlife3}, {mlife4}, {mlife5}, {mlife6}, and {inv4} defining memory residency lifecycle.
    - name: disk_cache_state
      type: cache_status
      description: Disk model cache status consumed before memory load operations.
    outputs:
    - name: memory_lifecycle_state_contract
      type: state_machine_contract
      description: A lifecycle contract for not loaded, loading, loaded, unloading, reload, failed, and keep-loaded states.
    - name: model_load_vram_fact_update
      type: runtime_fact_update
      description: Measured model static VRAM and model-loaded free VRAM facts emitted after successful lifecycle transitions.
    atomic_steps:
    - A-001
    - A-002
    - A-003
    - A-004
    - A-005
    status: draft
  context_file: execution_contexts/G-004-model-cache-and-lmcache/T-002-model-memory-lifecycle/t_context.yaml
  atomic_steps: 5
- tactical_step: T-003-lmcache-storage-telemetry
  source_file: docs/plans/G-004-model-cache-and-lmcache/T-003-lmcache-storage-telemetry/README.yaml
  spec:
    step_id: T-003
    parent_global_step: G-004
    name: LMCache Storage and Telemetry Contract
    description: 'Create the LMCache storage contract: define LMCache Integration (C-025) and LMCache Storage Telemetry (C-049) as CPU and disk cache tiers, namespace/session binding, hit/miss estimate fields, restore and write latency facts, eviction facts, and telemetry outputs that never count as free GPU VRAM.'
    concepts:
    - C-025
    - C-049
    - C-019
    - C-021
    - C-015
    - C-012
    inputs:
    - name: lmcache_claims
      type: source_labels
      description: Binding claims {lmcache1}, {lmcache3}, {lmcache4}, {lmcache5}, {lmcache7}, {lmc2}, and {inv5} defining LMCache integration and storage separation.
    - name: runtime_and_admission_facts
      type: runtime_context
      description: Runtime backend and admission context consumed to bind LMCache reuse and telemetry without weakening admission safety.
    outputs:
    - name: lmcache_storage_policy
      type: cache_policy_contract
      description: A policy contract for enabled state, storage tiers, namespace binding, limits, eviction, and compatibility with runtime and model profiles.
    - name: lmcache_telemetry_contract
      type: telemetry_contract
      description: Telemetry fields for hit tokens, miss tokens, hit quality, restore latency, CPU and disk usage, evictions, memory pressure, and swap indicators.
    atomic_steps:
