hrs_mrs_excerpts:
- concept_id: C-017
  name: Public Command Contract
  definition: The minimum stable command surface exposed by LMRS for health, capacity, admission, chat, queue, cache, and model lifecycle operations.
  properties:
  - The minimal runtime command set includes healthcheck, model status, capacity, token counting, dry-run estimate/admission, chat request, queue status, and request cancellation.
  - The estimate command performs dry-run admission and returns would_execute, would_queue, or would_reject with reason code, token breakdown, and capacity snapshot.
  - The chat command performs token counting and admission, then returns executed, queued, or rejected with the appropriate result, queue state, or stable reason code.
  - Additional cache and memory commands include local_model_cache_preload, local_model_cache_status, local_model_cache_delete, local_model_load, local_model_unload, and local_model_reload.
  source_labels:
  - '{cmd1}'
  - '{cmd2}'
  - '{cmd3}'
  - '{cmd4}'
  - '{dcache3}'
  - '{mlife2}'
- concept_id: C-023
  name: Disk Model Cache
  definition: The disk-resident model cache that stores model weights, tokenizer files, runtime metadata, integrity information, readiness state, and cache profile independently from VRAM residency.
  properties:
  - Preload downloads, verifies integrity, prepares local layout, tokenizer files, runtime metadata, and readiness marker without requiring VRAM load.
  - Disk cache and VRAM model residency are separate states.
  - Model states include not_cached, caching, cached_on_disk, loading_to_memory, loaded_in_memory, unloading, and failed.
  - Cache management commands add, check, delete, list, verify integrity, and update metadata.
  - Cache profile stores model_name, runtime, model_path, quantization/profile, declared_context_window, tokenizer profile, checksum or revision, disk size, load date, compatibility flags, and cache status.
  source_labels:
  - '{dcache1}'
  - '{dcache2}'
  - '{dcache3}'
  - '{dcache4}'
  - '{inv4}'
