tactical_step_spec:
  step_id: T-001
  parent_global_step: G-001
  name: Service Boundary Contract
  description: 'Create the LMRS service boundary contract: define the Local Model Runtime Service (C-001) as an independent runtime authority, bind its provider-gateway role through Provider Gateway Integration (C-002), expose it through the Adapter-Based MCP Interface (C-003), and encode the MVP Scope (C-022) as execution limits and invariants for the rest of the plan.'
  concepts:
  - C-001
  - C-002
  - C-003
  - C-022
  inputs:
  - name: service_boundary_claims
    type: source_labels
    description: Binding claims {lmrs}, {sep1}, {goal}, {adpt}, {mvp1}, {mvp2}, and {mvp3} defining service identity, separation, adapter exposure, and MVP limits.
  - name: service_boundary_concepts
    type: concept_set
    description: MRS concepts C-001, C-002, C-003, and C-022 with their service boundary relations.
  outputs:
  - name: service_boundary_contract
    type: domain_contract
    description: A precise contract that states what LMRS owns, what remains outside it, how it is exposed, and which MVP capabilities are in or out of scope.
  - name: top_level_invariants
    type: invariant_set
    description: Executor-facing invariants that oversized prompts are blocked before runtime and that LMRS remains separate from the provider gateway.
  atomic_steps:
  - A-001
  - A-002
  - A-003
  - A-004
  - A-005
  status: draft
hrs_mrs_excerpts:
- concept_id: C-001
  name: Local Model Runtime Service
  definition: A standalone adapter-based microservice that provides high-level access to locally executed language models while enforcing prompt admission before runtime execution.
  properties:
  - It is separate from model_access_core and ollama/model_workspace.
  - It exposes local model access through an adapter-based MCP interface.
  - It must prevent any prompt from reaching the local model runtime until context-window and dynamic VRAM capacity have been proven.
  source_labels:
  - '{lmrs}'
  - '{goal}'
  - '{inv1}'
- concept_id: C-002
  name: Provider Gateway Integration
  definition: The integration boundary through which model_access_core routes local provider requests to the Local Model Runtime Service.
  properties:
  - model_access_core remains the universal provider gateway.
  - model_access_core does not manage VRAM, load local models, or execute local prompts directly.
  - LMRS appears to model_access_core as a local provider backend and returns responses normalizable into canonical provider responses.
  source_labels:
  - '{sep1}'
  - '{prov}'
- concept_id: C-003
  name: Adapter-Based MCP Interface
  definition: The public MCP command surface implemented according to mcp_proxy_adapter conventions.
  properties:
  - The service is built on mcp_proxy_adapter principles.
  - Public commands expose schemas, validation, execution, metadata, structured responses, structured errors, healthcheck, and MCP Proxy registration.
  source_labels:
  - '{adpt}'
- concept_id: C-022
  name: MVP Scope
  definition: The explicit boundary of features included and excluded from the initial LMRS implementation.
  properties:
  - MVP includes one resident LLM on one GPU, persistent vectorizer/chunker services, service baseline measurement, model static measurement, tokenizer-aware counting, admission, largest-fit queue, one selected runtime backend, and adapter-based MCP commands.
  - MVP excludes multi-GPU scheduling, multiple resident LLMs, streaming, speculative decoding, distributed inference, automatic model eviction, and advanced batching optimizer.
  - MVP includes disk cache lifecycle, explicit memory load/unload, VRAM measurement after load, and basic vLLM LMCache configuration support.
  source_labels:
  - '{mvp1}'
  - '{mvp2}'
  - '{mvp3}'
