  - ChatMessage
  prompt: "Target file: lmrs/gateway.py\nOperation: create_file\n\nMRS excerpt:\n- C-004 Canonical Chat Request: the request structure accepted from the provider gateway for local model execution or admission decisions. It contains session_id, request_id, model_name, messages, tools, reserved_output_tokens, and options. It is close to the canonical chat request used by the provider gateway.\n\nCreate lmrs/gateway.py with exactly this initial content:\n\n```python\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom typing import Any, Mapping\n\n\n@dataclass(frozen=True)\nclass ChatMessage:\n    \"\"\"One role-tagged message from a canonical gateway chat request.\"\"\"\n\n    role: str\n    content: str | list[Mapping[str, Any]]\n    name: str | None = None\n    metadata: Mapping[str, Any] = field(default_factory=dict)\n```\n\nConstraints:\n- Use only the imports shown above.\n- The dataclass must be frozen.\n- The class name and field names must match exactly.\n\
    - Do not add validation helpers, request classes, response classes, or functions in this step."
