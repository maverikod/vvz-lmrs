tactical_step_spec:
  step_id: T-002
  parent_global_step: G-001
  name: Canonical Gateway Request Contract
  description: 'Create the canonical gateway request contract: define how Provider Gateway Integration (C-002) produces a Canonical Chat Request (C-004), how LMRS (C-001) consumes it, and how the Adapter-Based MCP Interface (C-003) receives enough structured data to route local model execution without taking ownership of provider-gateway responsibilities.'
  concepts:
  - C-001
  - C-002
  - C-003
  - C-004
  inputs:
  - name: gateway_request_claims
    type: source_labels
    description: Binding claims {prov} and {sep1} defining gateway-to-LMRS responsibilities and canonical request fields.
  - name: gateway_request_relations
    type: relation_set
    description: MRS relations C-002 produces C-004 and C-001 consumes C-004, plus the adapter interface relation.
  outputs:
  - name: canonical_request_contract
    type: api_contract
    description: A structured contract for accepted request fields, ownership boundaries, and normalized response expectations for local provider routing.
  - name: gateway_boundary_rules
    type: routing_rule_set
    description: Rules that prevent LMRS from assuming provider-gateway duties while still accepting canonical local-model requests.
  atomic_steps:
  - A-001
  - A-002
  - A-003
  - A-004
  - A-005
  status: draft
hrs_mrs_excerpts:
- concept_id: C-001
  name: Local Model Runtime Service
  definition: A standalone adapter-based microservice that provides high-level access to locally executed language models while enforcing prompt admission before runtime execution.
  properties:
  - It is separate from model_access_core and ollama/model_workspace.
  - It exposes local model access through an adapter-based MCP interface.
  - It must prevent any prompt from reaching the local model runtime until context-window and dynamic VRAM capacity have been proven.
  source_labels:
  - '{lmrs}'
  - '{goal}'
  - '{inv1}'
- concept_id: C-002
  name: Provider Gateway Integration
  definition: The integration boundary through which model_access_core routes local provider requests to the Local Model Runtime Service.
  properties:
  - model_access_core remains the universal provider gateway.
  - model_access_core does not manage VRAM, load local models, or execute local prompts directly.
  - LMRS appears to model_access_core as a local provider backend and returns responses normalizable into canonical provider responses.
  source_labels:
  - '{sep1}'
  - '{prov}'
- concept_id: C-003
  name: Adapter-Based MCP Interface
  definition: The public MCP command surface implemented according to mcp_proxy_adapter conventions.
  properties:
  - The service is built on mcp_proxy_adapter principles.
  - Public commands expose schemas, validation, execution, metadata, structured responses, structured errors, healthcheck, and MCP Proxy registration.
  source_labels:
  - '{adpt}'
- concept_id: C-004
  name: Canonical Chat Request
  definition: The request structure accepted from the provider gateway for local model execution or admission decisions.
  properties:
  - It contains session_id, request_id, model_name, messages, tools, reserved_output_tokens, and options.
  - It is close to the canonical chat request used by the provider gateway.
  source_labels:
  - '{prov}'
