hrs_mrs_excerpts:
- concept_id: C-028
  name: Command Schema Contract
  definition: The per-command request, result, and error schema contract used for validation and command discovery.
  properties:
  - Request schema is returned by get_schema.
  - Result schema is returned by get_result_schema.
  - Error schema is returned by get_error_schema.
  - Schemas live separately from executor code and are used by adapter schema-based validation before domain checks.
  source_labels:
  - '{asch}'
- concept_id: C-029
  name: Command Metadata Contract
  definition: The per-command discovery contract that publishes help, schema, error, and example information for MCP tooling.
  properties:
  - Metadata includes command name, description, parameter schema, result schema, error schema, stable error codes, and examples.
  - Metadata must be sufficient for MCP help, proxy discovery, and OpenAPI generation without reading internal implementation.
  - Metadata lives separately from executor code.
  source_labels:
  - '{amet}'
- concept_id: C-041
  name: Metadata-Driven CLI Help
  definition: The CLI help system that derives command documentation from command metadata and schemas.
  properties:
  - CLI help uses command metadata and schemas as its source of truth.
  - The CLI does not maintain a separate hand-written help catalog that can drift from command code.
  - Command names, parameter descriptions, examples, return shape, error cases, and best practices are exposed from metadata.
  source_labels:
  - '{clih}'
