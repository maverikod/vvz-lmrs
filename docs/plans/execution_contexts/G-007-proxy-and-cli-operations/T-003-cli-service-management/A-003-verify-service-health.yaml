  global_step: G-007-proxy-and-cli-operations
  tactical_step: T-003-cli-service-management
  atomic_step: A-003
  source_file: docs/plans/G-007-proxy-and-cli-operations/T-003-cli-service-management/atomic_steps/A-003-verify-service-health.yaml
