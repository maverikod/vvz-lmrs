tactical_step_spec:
  step_id: T-003
  parent_global_step: G-007
  name: CLI Service Management Contract
  description: 'Create the CLI operations contract: define CLI Command Wrapper Module (C-040), Metadata-Driven CLI Help (C-041), CLI Server Manager (C-042), and Service Health Verification (C-043) as the operator surface for command wrappers, help derived from metadata, start, stop, status, and health checks that use active service probes instead of PID-only evidence.'
