hrs_mrs_excerpts:
- concept_id: C-032
  name: Adapter Runtime Entrypoint
  definition: The startup boundary that wires command hooks, configuration loading, domain lifecycle services, and adapter server execution.
  properties:
  - The entrypoint registers LMRS command hooks before adapter server startup.
  - The entrypoint loads configuration and starts LMRS domain lifecycle services.
  - The entrypoint hands control to the adapter startup mechanism (create_app to build the application, then run via the adapter application runner).
  - Adapter factory code remains free of LMRS admission, tokenizer, VRAM, and model lifecycle logic.
  source_labels:
  - '{ahok}'
- concept_id: C-042
  name: CLI Server Manager
  definition: The CLI service-management surface that starts, stops, and reports status for the LMRS service runtime.
  properties:
  - The manager supports start, stop, and status operations.
  - The manager launches the configured service runtime.
  - The manager stops the correct service instance.
  - The manager reports status in a form useful for both humans and scripts.
  source_labels:
  - '{svcm}'
- concept_id: C-043
  name: Service Health Verification
  definition: A runtime status verification mechanism that proves service availability beyond PID or process-file presence.
  properties:
  - A running PID is not sufficient proof of service availability.
  - Status combines process identity with active service verification.
  - Valid probes include listener reachability, health endpoint response, command or help availability, registration state, heartbeat freshness, or another explicit protocol-appropriate runtime check.
  source_labels:
  - '{hlth}'
