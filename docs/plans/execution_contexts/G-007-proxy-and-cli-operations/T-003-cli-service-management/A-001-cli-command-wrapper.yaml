hrs_mrs_excerpts:
- concept_id: C-027
  name: Thin Adapter Command
  definition: A public LMRS command class that translates adapter calls into domain service execution without owning LMRS business logic.
  properties:
  - Each command inherits the adapter Command base class.
  - Each command exposes a stable name and uses use_queue for long-running work when required.
  - Each command validates parameters, delegates to a domain executor or service, and returns adapter SuccessResult or ErrorResult.
  - Adapter command classes do not embed admission, tokenizer, VRAM, or model lifecycle business logic.
  source_labels:
  - '{acmd}'
- concept_id: C-040
  name: CLI Command Wrapper Module
  definition: A dedicated CLI module that exposes local wrappers for the main LMRS user-facing and operator-facing commands.
  properties:
  - CLI wrappers call the canonical command contracts used by the adapter-facing command layer.
  - The CLI is a local operator surface over existing command implementation, not a separate command implementation.
  - The module groups main commands behind a scriptable command-line interface.
  source_labels:
  - '{cliw}'
