- ../../../00-common/common_context.yaml
- ../../../00-common/root_orchestrator_task.yaml
- ../../g_context.yaml
- ../t_context.yaml
- ./A-005-build-registration-payload.yaml
role: atomic_step_executor
required_model: gpt-5.3-codex-spark
scope:
  global_step: G-007-proxy-and-cli-operations
  tactical_step: T-001-network-registration-contract
  atomic_step: A-005
  source_file: docs/plans/G-007-proxy-and-cli-operations/T-001-network-registration-contract/atomic_steps/A-005-build-registration-payload.yaml
  target_file: lmrs/proxy/registration.py
atomic_step_spec:
  step_id: A-005
  parent_tactical_step: T-001
  name: Implement build_registration_payload
  target_file: lmrs/proxy/registration.py
  operation: modify_file
  priority: 5
  depends_on:
  - A-004
  concepts:
  - C-039
  - C-035
  - C-036
  objects:
  - build_registration_payload
  prompt: Modify lmrs/proxy/registration.py after A-001 through A-004. Append build_registration_payload(endpoint, advertised_url) that assembles the registration payload sent to the MCP proxy during registration and heartbeat. It resolves the server name by preferring an explicit server identifier, then an explicit server name, then a deterministic default from normalized host and port. It includes the reachable advertised URL, capabilities, and metadata where metadata includes server protocol, host, port, stable instance UUID when available, and adapter-specific discovery or routing metadata. Return the payload mapping. Do not perform the network call here.
  verification: &id001
    type: static_analysis
    target: lmrs/proxy/registration.py::build_registration_payload
    expected: build_registration_payload returns server identity, reachable URL, capabilities, and metadata with deterministic server-name resolution and protocol/host/port/instance UUID metadata.
  status: done
hrs_mrs_excerpts:
- concept_id: C-035
  name: Advertised Server URL
  definition: The proxy-visible URL derived from the server listen endpoint and normalized for reachability by the proxy.
  properties:
  - Wildcard bind addresses are not advertised directly.
  - An explicit advertised host is preferred when configured.
  - For local deployments, wildcard bind addresses are normalized to a reachable host such as localhost.
  source_labels:
  - '{radv}'
- concept_id: C-036
  name: Proxy Registration Endpoint
  definition: The registration-side contract that tells LMRS how to register, unregister, and send heartbeat data to the MCP proxy.
  properties:
  - Registration settings are separate from listener settings.
  - The contract includes enablement, startup and shutdown behavior, full registration URLs, heartbeat URL and interval, server identity, instance UUID, metadata, and client credentials.
  source_labels:
  - '{rprx}'
- concept_id: C-039
  name: Registration Payload
  definition: The server identity, reachable URL, capabilities, and metadata sent to the MCP proxy during registration and heartbeat.
  properties:
  - Server name resolution prefers explicit server identifier, then explicit server name, then a deterministic default from normalized host and port.
  - Metadata includes server protocol, host, port, stable instance UUID when available, and adapter-specific discovery or routing metadata.
  source_labels:
  - '{rpay}'
