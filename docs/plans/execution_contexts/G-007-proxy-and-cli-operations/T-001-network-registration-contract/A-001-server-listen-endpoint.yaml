hrs_mrs_excerpts:
- concept_id: C-034
  name: Server Listen Endpoint
  definition: The adapter server endpoint that binds the LMRS runtime to a configured local host, port, and protocol.
  properties:
  - Listen settings are independent from proxy registration settings.
  - The server protocol controls whether the bound listener is HTTP, HTTPS, or mTLS.
  - The endpoint may include server name, SSL or mTLS material, and optional advertised host.
