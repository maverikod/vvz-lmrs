    type: source_labels
    description: Binding claims {lstn}, {radv}, {rprx}, {rpro}, and {rpay} defining listener settings, advertised address rules, registration endpoints, protocol selection, and payload fields.
  - name: adapter_configuration_contract
    type: configuration_contract
    description: Generated and validated configuration sections for listen and registration settings.
