  name: Network and Registration Endpoint Contract
  description: 'Create the network registration contract: define Server Listen Endpoint (C-034), Advertised Server URL (C-035), Proxy Registration Endpoint (C-036), Registration Protocol Resolution (C-037), and Registration Payload (C-039) as the protocol-aware address and payload model used by adapter startup and proxy discovery.'
