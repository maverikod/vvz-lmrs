atomic_step_spec:
  step_id: A-001
  parent_tactical_step: T-002
  name: Define RegistrationState
  target_file: lmrs/proxy/lifecycle.py
  operation: create_file
  priority: 1
  depends_on: []
  concepts:
  - C-038
  objects:
  - RegistrationState
  prompt: Create lmrs/proxy/lifecycle.py and define frozen dataclass RegistrationState with registered bool default False, last_heartbeat_at, heartbeat_fresh bool, instance_uuid, server_name, proxy_recognized bool, and metadata. It is the structured status object for registered state, heartbeat freshness, instance identity, and proxy recognition. Do not add lifecycle policy or the run loop in this step.
