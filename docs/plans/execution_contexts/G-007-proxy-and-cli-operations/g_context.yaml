    - C-035
    - C-036
    - C-037
    - C-039
    - C-030
    - C-031
    inputs:
    - name: network_registration_claims
      type: source_labels
      description: Binding claims {lstn}, {radv}, {rprx}, {rpro}, and {rpay} defining listener settings, advertised address rules, registration endpoints, protocol selection, and payload fields.
    - name: adapter_configuration_contract
      type: configuration_contract
      description: Generated and validated configuration sections for listen and registration settings.
    outputs:
    - name: listen_endpoint_contract
      type: network_contract
      description: A contract for host, port, protocol, server name, advertised host, and SSL or mTLS listener settings.
    - name: proxy_registration_payload_contract
      type: registration_contract
      description: A contract for registration URL, protocol, credentials, server identity, advertised URL, capabilities, metadata, and payload content.
    atomic_steps:
    - A-001
    - A-002
    - A-003
    - A-004
    - A-005
    - A-006
    status: draft
  context_file: execution_contexts/G-007-proxy-and-cli-operations/T-001-network-registration-contract/t_context.yaml
  atomic_steps: 6
- tactical_step: T-002-registration-lifecycle
  source_file: docs/plans/G-007-proxy-and-cli-operations/T-002-registration-lifecycle/README.yaml
  spec:
    step_id: T-002
    parent_global_step: G-007
    name: Proxy Registration Lifecycle
    description: 'Create the proxy registration lifecycle contract: define Proxy Registration Lifecycle (C-038) as the startup, heartbeat, re-registration, retry, and shutdown behavior that uses Proxy Registration Endpoint (C-036), Advertised Server URL (C-035), and Registration Payload (C-039).'
    concepts:
    - C-038
    - C-036
    - C-035
    - C-039
    inputs:
    - name: registration_endpoint_contract
      type: registration_contract
      description: Registration endpoint and payload contracts consumed by registration lifecycle policy.
    - name: adapter_runtime_state
      type: runtime_state
      description: Runtime listener readiness and shutdown state emitted by the adapter runtime entrypoint.
    outputs:
    - name: registration_lifecycle_policy
      type: lifecycle_contract
      description: A policy for waiting until listener readiness, registering, heartbeating, retrying, re-registering, and unregistering during shutdown.
    - name: registration_state_snapshot
      type: status_contract
      description: A structured status object for registered state, heartbeat freshness, instance identity, and proxy recognition.
    atomic_steps:
    - A-001
    - A-002
    - A-003
    status: draft
  context_file: execution_contexts/G-007-proxy-and-cli-operations/T-002-registration-lifecycle/t_context.yaml
  atomic_steps: 3
- tactical_step: T-003-cli-service-management
  source_file: docs/plans/G-007-proxy-and-cli-operations/T-003-cli-service-management/README.yaml
  spec:
    step_id: T-003
    parent_global_step: G-007
    name: CLI Service Management Contract
    description: 'Create the CLI operations contract: define CLI Command Wrapper Module (C-040), Metadata-Driven CLI Help (C-041), CLI Server Manager (C-042), and Service Health Verification (C-043) as the operator surface for command wrappers, help derived from metadata, start, stop, status, and health checks that use active service probes instead of PID-only evidence.'
    concepts:
    - C-040
    - C-041
    - C-042
    - C-043
    - C-027
    - C-028
    - C-029
    - C-032
    - C-034
    - C-035
    - C-038
    inputs:
    - name: adapter_command_contracts
      type: adapter_contract_set
      description: Thin command, schema, metadata, and runtime hook contracts consumed by CLI operations.
    - name: runtime_registration_status
      type: status_contract
      description: Listener, advertised URL, and registration lifecycle status needed by service health verification.
    outputs:
    - name: cli_wrapper_contract
      type: operator_contract
      description: A contract for local command wrappers that call canonical command contracts and expose metadata-derived help.
    - name: server_manager_contract
      type: operator_lifecycle_contract
      description: A contract for start, stop, and status operations with exact service identity and active health verification.
    - name: service_health_probe_contract
      type: health_contract
      description: A health verification contract combining process identity, listener reachability, health response, command/help availability, registration state, and heartbeat freshness.
    atomic_steps:
    - A-001
    - A-002
    - A-003
    - A-004
    status: draft
  context_file: execution_contexts/G-007-proxy-and-cli-operations/T-003-cli-service-management/t_context.yaml
  atomic_steps: 4
