hrs_mrs_excerpts:
- concept_id: C-027
  name: Thin Adapter Command
  definition: A public LMRS command class that translates adapter calls into domain service execution without owning LMRS business logic.
  properties:
  - Each command inherits the adapter Command base class.
  - Each command exposes a stable name and uses use_queue for long-running work when required.
  - Each command validates parameters, delegates to a domain executor or service, and returns adapter SuccessResult or ErrorResult.
  - Adapter command classes do not embed admission, tokenizer, VRAM, or model lifecycle business logic.
  source_labels:
  - '{acmd}'
- concept_id: C-028
  name: Command Schema Contract
  definition: The per-command request, result, and error schema contract used for validation and command discovery.
  properties:
  - Request schema is returned by get_schema.
  - Result schema is returned by get_result_schema.
  - Error schema is returned by get_error_schema.
  - Schemas live separately from executor code and are used by adapter schema-based validation before domain checks.
  source_labels:
  - '{asch}'
- concept_id: C-029
  name: Command Metadata Contract
  definition: The per-command discovery contract that publishes help, schema, error, and example information for MCP tooling.
  properties:
  - Metadata includes command name, description, parameter schema, result schema, error schema, stable error codes, and examples.
  - Metadata must be sufficient for MCP help, proxy discovery, and OpenAPI generation without reading internal implementation.
  - Metadata lives separately from executor code.
  source_labels:
  - '{amet}'
- concept_id: C-030
  name: Adapter Configuration Generator
  definition: The LMRS configuration generator that extends the adapter generator with LMRS-specific runtime and admission configuration sections.
  properties:
  - The generator first creates adapter server, registration, and queue manager configuration.
  - The generator adds LMRS sections for hardware profile, resident services, model profiles, runtime backends, tokenizer profiles, admission policy, disk model cache, LMCache, telemetry, and lifecycle limits.
  - Generated configuration is the starting point for validated LMRS runtime configuration.
  source_labels:
  - '{acfg}'
- concept_id: C-031
  name: Adapter Configuration Validator
  definition: The LMRS configuration validator that extends adapter validation with LMRS-specific consistency checks.
  properties:
  - The validator first checks base adapter configuration sections.
  - The validator checks model, runtime, tokenizer, hardware, resident service, queue, admission, disk cache, LMCache, error, and telemetry sections.
  - The validator rejects inconsistent or incomplete configuration before LMRS starts or accepts runtime work.
  source_labels:
  - '{aval}'
- concept_id: C-032
  name: Adapter Runtime Entrypoint
  definition: The startup boundary that wires command hooks, configuration loading, domain lifecycle services, and adapter server execution.
  properties:
  - The entrypoint registers LMRS command hooks before adapter server startup.
  - The entrypoint loads configuration and starts LMRS domain lifecycle services.
  - The entrypoint hands control to the adapter startup mechanism (create_app to build the application, then run via the adapter application runner).
  - Adapter factory code remains free of LMRS admission, tokenizer, VRAM, and model lifecycle logic.
  source_labels:
  - '{ahok}'
- concept_id: C-034
  name: Server Listen Endpoint
  definition: The adapter server endpoint that binds the LMRS runtime to a configured local host, port, and protocol.
  properties:
  - Listen settings are independent from proxy registration settings.
  - The server protocol controls whether the bound listener is HTTP, HTTPS, or mTLS.
  - The endpoint may include server name, SSL or mTLS material, and optional advertised host.
  source_labels:
  - '{lstn}'
- concept_id: C-035
  name: Advertised Server URL
  definition: The proxy-visible URL derived from the server listen endpoint and normalized for reachability by the proxy.
  properties:
  - Wildcard bind addresses are not advertised directly.
  - An explicit advertised host is preferred when configured.
  - For local deployments, wildcard bind addresses are normalized to a reachable host such as localhost.
  source_labels:
  - '{radv}'
- concept_id: C-036
  name: Proxy Registration Endpoint
  definition: The registration-side contract that tells LMRS how to register, unregister, and send heartbeat data to the MCP proxy.
  properties:
  - Registration settings are separate from listener settings.
  - The contract includes enablement, startup and shutdown behavior, full registration URLs, heartbeat URL and interval, server identity, instance UUID, metadata, and client credentials.
  source_labels:
  - '{rprx}'
- concept_id: C-037
  name: Registration Protocol Resolution
  definition: The rule set that resolves the proxy client protocol from registration URL scheme and credential material.
  properties:
  - HTTP registration URLs select HTTP.
  - HTTPS registration URLs select HTTPS unless client certificate, client key, and CA material are present.
  - HTTPS registration with full client credential material selects mTLS.
  - Missing or unsupported URL schemes are configuration errors.
  source_labels:
  - '{rpro}'
- concept_id: C-038
  name: Proxy Registration Lifecycle
  definition: The startup, heartbeat, retry, re-registration, and shutdown behavior used to keep the LMRS adapter visible through the proxy.
  properties:
  - Startup waits until the advertised server URL is listening before proxy registration.
  - Heartbeat sends registration payloads on the configured interval.
  - Failed or unrecognized registrations are retried and may trigger re-registration.
  - Shutdown unregisters the adapter when configured.
  source_labels:
  - '{rhbt}'
- concept_id: C-039
  name: Registration Payload
  definition: The server identity, reachable URL, capabilities, and metadata sent to the MCP proxy during registration and heartbeat.
  properties:
  - Server name resolution prefers explicit server identifier, then explicit server name, then a deterministic default from normalized host and port.
  - Metadata includes server protocol, host, port, stable instance UUID when available, and adapter-specific discovery or routing metadata.
  source_labels:
  - '{rpay}'
- concept_id: C-040
  name: CLI Command Wrapper Module
  definition: A dedicated CLI module that exposes local wrappers for the main LMRS user-facing and operator-facing commands.
  properties:
  - CLI wrappers call the canonical command contracts used by the adapter-facing command layer.
  - The CLI is a local operator surface over existing command implementation, not a separate command implementation.
  - The module groups main commands behind a scriptable command-line interface.
  source_labels:
  - '{cliw}'
- concept_id: C-041
  name: Metadata-Driven CLI Help
  definition: The CLI help system that derives command documentation from command metadata and schemas.
  properties:
  - CLI help uses command metadata and schemas as its source of truth.
  - The CLI does not maintain a separate hand-written help catalog that can drift from command code.
  - Command names, parameter descriptions, examples, return shape, error cases, and best practices are exposed from metadata.
  source_labels:
  - '{clih}'
- concept_id: C-042
  name: CLI Server Manager
  definition: The CLI service-management surface that starts, stops, and reports status for the LMRS service runtime.
  properties:
  - The manager supports start, stop, and status operations.
  - The manager launches the configured service runtime.
  - The manager stops the correct service instance.
  - The manager reports status in a form useful for both humans and scripts.
  source_labels:
  - '{svcm}'
- concept_id: C-043
  name: Service Health Verification
  definition: A runtime status verification mechanism that proves service availability beyond PID or process-file presence.
  properties:
  - A running PID is not sufficient proof of service availability.
  - Status combines process identity with active service verification.
  - Valid probes include listener reachability, health endpoint response, command or help availability, registration state, heartbeat freshness, or another explicit protocol-appropriate runtime check.
  source_labels:
  - '{hlth}'
