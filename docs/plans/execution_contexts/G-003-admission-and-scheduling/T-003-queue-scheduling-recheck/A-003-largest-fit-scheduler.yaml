schema_version: lmrs.execution_context.v1
language: en
file_kind: as_context
context_bundle_order:
- ../../../00-common/common_context.yaml
- ../../../00-common/root_orchestrator_task.yaml
- ../../g_context.yaml
- ../t_context.yaml
- ./A-003-largest-fit-scheduler.yaml
role: atomic_step_executor
required_model: gpt-5.3-codex-spark
scope:
  global_step: G-003-admission-and-scheduling
  tactical_step: T-003-queue-scheduling-recheck
  atomic_step: A-003
  source_file: docs/plans/G-003-admission-and-scheduling/T-003-queue-scheduling-recheck/atomic_steps/A-003-largest-fit-scheduler.yaml
  target_file: lmrs/queue.py
atomic_step_spec:
  step_id: A-003
  parent_tactical_step: T-003
  name: Implement largest_fit_scheduler
  target_file: lmrs/queue.py
  operation: modify_file
  priority: 3
  depends_on:
  - A-002
  concepts:
  - C-014
  - C-013
  objects:
  - largest_fit_scheduler
  prompt: 'Modify lmrs/queue.py after A-001 and A-002. Append largest_fit_scheduler(entries: tuple[QueueEntry, ...], usable_dynamic_vram_bytes: int) -> QueueEntry | None. It must choose the largest queued entry whose required_dynamic_vram_bytes fits current usable VRAM, using priority/admission time as deterministic tie-breakers. Do not implement FIFO as the primary policy.'
  verification: &id001
    type: static_analysis
    target: lmrs/queue.py::largest_fit_scheduler
    expected: Function selects the largest fitting queued request under current usable dynamic VRAM with deterministic tie-breaking.
  status: done
hrs_mrs_excerpts:
- concept_id: C-013
  name: Request Queue
  definition: The queue of admitted requests waiting for dynamic VRAM capacity or scheduler selection.
  properties:
  - Queued records store request_id, session_id, model_name, token counts, required dynamic VRAM, admission timestamp, expiration timestamp, priority, and status.
  - Queued requests must pass capacity recheck before actual launch.
  source_labels:
  - '{que1}'
  - '{rech}'
- concept_id: C-014
  name: Scheduler Policy
  definition: The policy that selects queued requests for execution when dynamic VRAM becomes available.
  properties:
  - The primary policy is largest-fit scheduling.
  - Largest-fit selects the largest queued request that fits the current dynamic pool.
  - FIFO is allowed only as fallback or a configurable mode.
  source_labels:
  - '{que2}'
  - '{que3}'
execution_rules:
  single_target_step: true
  assume_empty_initial_context: true
  use_only_concatenated_context: true
  no_guessing: true
  on_conflict_or_missing_fact: Escalate to the T orchestrator with exact file paths, command outputs, and the decision required.
acceptance:
- *id001
- Report changed files and verification evidence to the T orchestrator.
