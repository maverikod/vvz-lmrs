  prompt: 'Modify lmrs/queue.py after A-001 through A-003. Append launch_recheck(entry: QueueEntry, usable_dynamic_vram_bytes: int) -> bool. It must re-check current usable dynamic VRAM immediately before launch and return true only when the queued entry still fits. Do not call runtime execution.'
