atomic_step_spec:
  step_id: A-002
  parent_tactical_step: T-002
  name: Define AdmissionVerdict
  target_file: lmrs/admission.py
  operation: modify_file
  priority: 2
  depends_on:
  - A-001
  concepts:
  - C-012
  - C-013
  objects:
  - AdmissionVerdict
  prompt: Modify lmrs/admission.py after A-001. Append frozen dataclass AdmissionVerdict with decision, reason_code, request_id, model_name, required_tokens, required_dynamic_vram_bytes, queueable bool default False, and metadata. Decisions are would_execute, would_queue, or would_reject. Keep it as a data contract only.
  verification: &id001
    type: static_analysis
    target: lmrs/admission.py::AdmissionVerdict
    expected: AdmissionVerdict stores execute/queue/reject decision, stable reason code, request identity, requirement facts, queueability, and metadata.
  status: done
hrs_mrs_excerpts:
- concept_id: C-012
  name: Admission Control
  definition: The pre-queue decision process that classifies requests as executable, queueable, or rejected using context-window and VRAM capacity constraints.
  properties:
  - Admission runs before a request enters the queue.
  - Requests over the model context window are rejected with CONTEXT_OVERFLOW.
  - Requests too large for the maximum dynamic pool are rejected with REQUEST_TOO_LARGE or HARDWARE_VRAM_INSUFFICIENT.
  - Requests that fit the maximum dynamic pool but not current capacity are queued, not permanently rejected.
  - Requests fitting both model window and current dynamic pool may execute immediately or be queued according to scheduler policy.
  - LMCache reuse does not permit unsafe admission.
  source_labels:
  - '{adm1}'
  - '{adm2}'
  - '{adm3}'
  - '{inv1}'
  - '{inv2}'
  - '{lmcache2}'
  - '{lmcache6}'
  - '{inv5}'
- concept_id: C-013
  name: Request Queue
  definition: The queue of admitted requests waiting for dynamic VRAM capacity or scheduler selection.
  properties:
  - Queued records store request_id, session_id, model_name, token counts, required dynamic VRAM, admission timestamp, expiration timestamp, priority, and status.
  - Queued requests must pass capacity recheck before actual launch.
  source_labels:
  - '{que1}'
  - '{rech}'
execution_rules:
  single_target_step: true
  assume_empty_initial_context: true
  use_only_concatenated_context: true
  no_guessing: true
  on_conflict_or_missing_fact: Escalate to the T orchestrator with exact file paths, command outputs, and the decision required.
acceptance:
