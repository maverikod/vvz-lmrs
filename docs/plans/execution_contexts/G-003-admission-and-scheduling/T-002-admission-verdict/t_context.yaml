  - C-011
  - C-012
  - C-013
  - C-047
  - C-048
  inputs:
  - name: capacity_estimate
    type: estimate_result
    description: Token and VRAM estimate consumed by the admission verdict contract.
  - name: current_runtime_capacity
    type: capacity_snapshot
    description: Current usable dynamic VRAM and runtime readiness facts needed to classify the request.
  outputs:
  - name: admission_verdict
    type: decision_contract
    description: A structured decision of execute, queue, or reject with reason codes for context overflow, oversized request, insufficient hardware, or temporary capacity pressure.
  - name: queue_entry_request
    type: queue_input
    description: A queueable request representation emitted only when the request fits the maximum dynamic pool but not the current pool.
