tactical_step_spec:
  step_id: T-002
  parent_global_step: G-003
  name: Admission Verdict Contract
  description: 'Create the admission verdict contract: use Admission Control (C-012), Request Capacity Estimate (C-011), Request Dynamic VRAM Requirement (C-047), LMCache Admission Constraint (C-048), and Request Queue (C-013) to produce execute, queue, or reject decisions with stable capacity reasons.'
