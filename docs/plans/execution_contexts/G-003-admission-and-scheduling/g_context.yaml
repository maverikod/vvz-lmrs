hrs_mrs_excerpts:
- concept_id: C-010
  name: Token Accounting
  definition: The tokenizer-aware accounting process that computes request token requirements before queuing and before runtime execution.
  properties:
  - Token counting covers final prompt/chat-template content, system messages, role markers, assistant/user messages, tool schemas, service headers, and reserved output tokens.
  - The preferred mode uses the tokenizer matching the executing model and runtime.
  - Rough chars/4 estimates are allowed only as explicitly marked fallback.
  - If exact tokenizer is unavailable, the service either uses explicitly allowed approximate mode or rejects with TOKENIZER_UNAVAILABLE.
  source_labels:
  - '{tok1}'
  - '{tok2}'
  - '{tok3}'
- concept_id: C-011
  name: Request Capacity Estimate
  definition: The computed token and dynamic VRAM requirement for an individual request.
  properties:
  - required_tokens includes input tokens, tool tokens, service tokens, and reserved output tokens.
  - Requests exceeding the declared model context window are rejected.
  - Dynamic VRAM estimate is based on required_tokens, calibrated KV-cache cost per token, and per-request overhead.
  - Allowed request size is the minimum of declared context window and dynamic-pool token capacity.
  source_labels:
  - '{lim1}'
  - '{lim2}'
  - '{lim3}'
- concept_id: C-012
  name: Admission Control
  definition: The pre-queue decision process that classifies requests as executable, queueable, or rejected using context-window and VRAM capacity constraints.
  properties:
  - Admission runs before a request enters the queue.
  - Requests over the model context window are rejected with CONTEXT_OVERFLOW.
  - Requests too large for the maximum dynamic pool are rejected with REQUEST_TOO_LARGE or HARDWARE_VRAM_INSUFFICIENT.
  - Requests that fit the maximum dynamic pool but not current capacity are queued, not permanently rejected.
  - Requests fitting both model window and current dynamic pool may execute immediately or be queued according to scheduler policy.
  - LMCache reuse does not permit unsafe admission.
  source_labels:
  - '{adm1}'
  - '{adm2}'
  - '{adm3}'
  - '{inv1}'
  - '{inv2}'
  - '{lmcache2}'
  - '{lmcache6}'
  - '{inv5}'
- concept_id: C-013
  name: Request Queue
  definition: The queue of admitted requests waiting for dynamic VRAM capacity or scheduler selection.
  properties:
  - Queued records store request_id, session_id, model_name, token counts, required dynamic VRAM, admission timestamp, expiration timestamp, priority, and status.
  - Queued requests must pass capacity recheck before actual launch.
  source_labels:
  - '{que1}'
  - '{rech}'
- concept_id: C-014
  name: Scheduler Policy
  definition: The policy that selects queued requests for execution when dynamic VRAM becomes available.
  properties:
  - The primary policy is largest-fit scheduling.
  - Largest-fit selects the largest queued request that fits the current dynamic pool.
  - FIFO is allowed only as fallback or a configurable mode.
  source_labels:
  - '{que2}'
  - '{que3}'
- concept_id: C-044
  name: KV Cache Byte Formula
  definition: Formula contract for computing worst-case KV-cache byte usage from request tokens and explicit model/runtime parameters.
  properties:
    formula: kv_bytes = tokens * layers * 2 * kv_heads * head_dim * kv_element_bytes
    key_value_factor: 2
    derived_facts:
    - kv_bytes_per_token = layers * 2 * kv_heads * head_dim * kv_element_bytes
    - kv_full_window_bytes = declared_context_window * kv_bytes_per_token
    scope: Used for model profile facts, request estimates, and full-window capacity calculations.
  source_labels:
  - '{kvf1}'
  - '{ctxb}'
- concept_id: C-046
  name: Usable Dynamic VRAM Formula
  definition: Runtime formula for the currently usable GPU dynamic memory pool after model load, safety margin, runtime reserve, and active request reservations.
  properties:
    formula: usable_dynamic_vram_bytes = model_loaded_free_vram_bytes - safety_margin_bytes - runtime_reserve_bytes - active_reservation_bytes
    active_reservation_bytes: Sum of reservations held by running requests.
    admission_rule: Admission and scheduling use current usable dynamic VRAM, not total VRAM, total RAM, disk cache size, or LMCache capacity.
  source_labels:
  - '{vram1}'
- concept_id: C-047
  name: Request Dynamic VRAM Requirement
  definition: Per-request formula for dynamic VRAM required to execute a request safely at runtime.
  properties:
    formula: required_dynamic_vram_bytes = input_kv_bytes + reserved_output_kv_bytes + per_request_overhead_bytes + runtime_batch_overhead_bytes
    input_kv_bytes: Computed from the final tokenized prompt.
    reserved_output_kv_bytes: Computed from reserved output tokens.
    execution_predicate: required_tokens <= declared_context_window and required_dynamic_vram_bytes <= usable_dynamic_vram_bytes
  source_labels:
  - '{resv1}'
  - '{lim1}'
  - '{lim2}'
- concept_id: C-048
  name: LMCache Admission Constraint
  definition: Conservative admission rule for treating LMCache reuse as optional reduction of new-token KV work only when a pre-admission exact hit is available.
  properties:
    not_capacity: LMCache is not additional VRAM capacity and does not extend the model context window.
    full_prompt_rule: The full prompt is always validated against the declared context window.
    hit_rule: Request KV estimate may be reduced only for an exact pre-admission cache hit matching token chunks, model profile, runtime profile, and namespace.
    miss_rule: If the hit is not guaranteed before execution, the request is admitted as a cache miss.
  source_labels:
  - '{lmc1}'
  - '{lmcache2}'
  - '{lmcache6}'
  - '{inv5}'
tactical_steps:
- tactical_step: T-001-token-capacity-estimate
  source_file: docs/plans/G-003-admission-and-scheduling/T-001-token-capacity-estimate/README.yaml
  spec:
    step_id: T-001
    parent_global_step: G-003
    name: Token and Capacity Estimate
    description: 'Create the preflight estimate object: apply Token Accounting (C-010), produce Request Capacity Estimate (C-011), compute Request Dynamic VRAM Requirement (C-047), and consume the relevant KV and usable VRAM facts without making an admission decision.'
    concepts:
    - C-010
    - C-011
    - C-047
    - C-044
    - C-046
    inputs:
    - name: canonical_request
      type: request_contract
      description: The canonical request structure consumed by token accounting, including final prompt material and reserved output tokens.
    - name: memory_facts
      type: capacity_fact_set
      description: KV byte facts and usable dynamic VRAM facts consumed by token capacity estimation.
    outputs:
    - name: token_breakdown
      type: estimate_component
      description: Input, tool, service, and reserved output token counts with tokenizer accuracy status.
    - name: dynamic_vram_requirement
      type: estimate_component
      description: Required dynamic VRAM bytes computed before admission using request tokens and overhead fields.
    atomic_steps:
    - A-001
    - A-002
    - A-003
    - A-004
    - A-005
    status: draft
  context_file: execution_contexts/G-003-admission-and-scheduling/T-001-token-capacity-estimate/t_context.yaml
  atomic_steps: 5
- tactical_step: T-002-admission-verdict
  source_file: docs/plans/G-003-admission-and-scheduling/T-002-admission-verdict/README.yaml
  spec:
    step_id: T-002
    parent_global_step: G-003
    name: Admission Verdict Contract
    description: 'Create the admission verdict contract: use Admission Control (C-012), Request Capacity Estimate (C-011), Request Dynamic VRAM Requirement (C-047), LMCache Admission Constraint (C-048), and Request Queue (C-013) to produce execute, queue, or reject decisions with stable capacity reasons.'
    concepts:
    - C-011
    - C-012
    - C-013
    - C-047
    - C-048
    inputs:
    - name: capacity_estimate
      type: estimate_result
      description: Token and VRAM estimate consumed by the admission verdict contract.
    - name: current_runtime_capacity
      type: capacity_snapshot
      description: Current usable dynamic VRAM and runtime readiness facts needed to classify the request.
    outputs:
    - name: admission_verdict
      type: decision_contract
      description: A structured decision of execute, queue, or reject with reason codes for context overflow, oversized request, insufficient hardware, or temporary capacity pressure.
    - name: queue_entry_request
      type: queue_input
      description: A queueable request representation emitted only when the request fits the maximum dynamic pool but not the current pool.
    atomic_steps:
    - A-001
    - A-002
    - A-003
    - A-004
    - A-005
    status: draft
  context_file: execution_contexts/G-003-admission-and-scheduling/T-002-admission-verdict/t_context.yaml
  atomic_steps: 5
- tactical_step: T-003-queue-scheduling-recheck
  source_file: docs/plans/G-003-admission-and-scheduling/T-003-queue-scheduling-recheck/README.yaml
  spec:
    step_id: T-003
    parent_global_step: G-003
    name: Queue Scheduling and Launch Recheck
    description: 'Create the queue execution contract: manage Request Queue (C-013), apply Scheduler Policy (C-014), and perform launch-time recheck through Admission Control (C-012) before a queued request is released to runtime execution.'
    concepts:
    - C-012
    - C-013
    - C-014
    inputs:
    - name: queue_entry_request
      type: queue_input
      description: Queueable request representation consumed by scheduler policy and launch-time recheck.
    - name: capacity_release_event
      type: runtime_event
      description: A signal that dynamic VRAM or scheduler state changed and queued requests may be reconsidered.
    outputs:
    - name: scheduled_request
      type: execution_candidate
      description: The largest fitting queued request selected under scheduler policy and validated by launch-time capacity recheck.
    - name: queue_state_snapshot
      type: queue_status
      description: A structured queue status containing stored estimates, priorities, timestamps, and request states.
    atomic_steps:
    - A-001
    - A-002
    - A-003
    - A-004
    status: draft
  context_file: execution_contexts/G-003-admission-and-scheduling/T-003-queue-scheduling-recheck/t_context.yaml
  atomic_steps: 4
