schema_version: lmrs.execution_context.v1
language: en
file_kind: as_context
context_bundle_order:
- ../../../00-common/common_context.yaml
- ../../../00-common/root_orchestrator_task.yaml
- ../../g_context.yaml
- ../t_context.yaml
- ./A-004-calculate-dynamic-vram-requirement.yaml
role: atomic_step_executor
required_model: gpt-5.3-codex-spark
scope:
  global_step: G-003-admission-and-scheduling
  tactical_step: T-001-token-capacity-estimate
  atomic_step: A-004
  source_file: docs/plans/G-003-admission-and-scheduling/T-001-token-capacity-estimate/atomic_steps/A-004-calculate-dynamic-vram-requirement.yaml
  target_file: lmrs/estimation.py
atomic_step_spec:
  step_id: A-004
  parent_tactical_step: T-001
  name: Implement calculate_dynamic_vram_requirement
  target_file: lmrs/estimation.py
  operation: modify_file
  priority: 4
  depends_on:
  - A-003
  concepts:
  - C-047
  - C-044
  objects:
  - calculate_dynamic_vram_requirement
  prompt: 'Modify lmrs/estimation.py after A-001 through A-003. Append calculate_dynamic_vram_requirement(required_tokens: int, kv_bytes_per_token: int, per_request_overhead_bytes: int, runtime_batch_overhead_bytes: int) -> int. It must implement required_dynamic_vram_bytes = required_tokens * kv_bytes_per_token + per_request_overhead_bytes + runtime_batch_overhead_bytes, rejecting negative inputs. Do not use total RAM, disk cache, or LMCache storage as capacity.'
  verification: &id001
    type: static_analysis
    target: lmrs/estimation.py::calculate_dynamic_vram_requirement
    expected: Function computes request dynamic VRAM using required tokens, KV bytes per token, and overhead fields.
  status: done
hrs_mrs_excerpts:
- concept_id: C-044
  name: KV Cache Byte Formula
  definition: Formula contract for computing worst-case KV-cache byte usage from request tokens and explicit model/runtime parameters.
  properties:
    formula: kv_bytes = tokens * layers * 2 * kv_heads * head_dim * kv_element_bytes
    key_value_factor: 2
    derived_facts:
    - kv_bytes_per_token = layers * 2 * kv_heads * head_dim * kv_element_bytes
    - kv_full_window_bytes = declared_context_window * kv_bytes_per_token
    scope: Used for model profile facts, request estimates, and full-window capacity calculations.
  source_labels:
  - '{kvf1}'
  - '{ctxb}'
- concept_id: C-047
  name: Request Dynamic VRAM Requirement
  definition: Per-request formula for dynamic VRAM required to execute a request safely at runtime.
  properties:
    formula: required_dynamic_vram_bytes = input_kv_bytes + reserved_output_kv_bytes + per_request_overhead_bytes + runtime_batch_overhead_bytes
    input_kv_bytes: Computed from the final tokenized prompt.
    reserved_output_kv_bytes: Computed from reserved output tokens.
    execution_predicate: required_tokens <= declared_context_window and required_dynamic_vram_bytes <= usable_dynamic_vram_bytes
  source_labels:
  - '{resv1}'
  - '{lim1}'
  - '{lim2}'
execution_rules:
  single_target_step: true
  assume_empty_initial_context: true
  use_only_concatenated_context: true
  no_guessing: true
  on_conflict_or_missing_fact: Escalate to the T orchestrator with exact file paths, command outputs, and the decision required.
acceptance:
- *id001
- Report changed files and verification evidence to the T orchestrator.
