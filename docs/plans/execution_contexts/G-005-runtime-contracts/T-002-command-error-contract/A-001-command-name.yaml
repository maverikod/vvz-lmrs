atomic_step_spec:
  step_id: A-001
  parent_tactical_step: T-002
  name: Define CommandName
  target_file: lmrs/commands.py
  operation: create_file
  priority: 1
  depends_on: []
  concepts:
  - C-017
  objects:
  - CommandName
  prompt: Create lmrs/commands.py and define CommandName string constants or enum values for healthcheck, model_status, capacity, token_count, estimate, chat, queue_status, cancel, local_model_cache_preload, local_model_cache_status, local_model_cache_delete, local_model_load, local_model_unload, and local_model_reload. It names the minimum stable public command surface. Do not add result shapes or error codes in this step.
  verification: &id001
    type: static_analysis
    target: lmrs/commands.py::CommandName
    expected: CommandName exposes the stable public command surface including health, status, capacity, token count, estimate, chat, queue, cancel, and cache and model lifecycle commands.
  status: done
hrs_mrs_excerpts:
- concept_id: C-017
  name: Public Command Contract
  definition: The minimum stable command surface exposed by LMRS for health, capacity, admission, chat, queue, cache, and model lifecycle operations.
  properties:
  - The minimal runtime command set includes healthcheck, model status, capacity, token counting, dry-run estimate/admission, chat request, queue status, and request cancellation.
  - The estimate command performs dry-run admission and returns would_execute, would_queue, or would_reject with reason code, token breakdown, and capacity snapshot.
  - The chat command performs token counting and admission, then returns executed, queued, or rejected with the appropriate result, queue state, or stable reason code.
  - Additional cache and memory commands include local_model_cache_preload, local_model_cache_status, local_model_cache_delete, local_model_load, local_model_unload, and local_model_reload.
  source_labels:
  - '{cmd1}'
  - '{cmd2}'
  - '{cmd3}'
  - '{cmd4}'
  - '{dcache3}'
  - '{mlife2}'
execution_rules:
  single_target_step: true
  assume_empty_initial_context: true
  use_only_concatenated_context: true
  no_guessing: true
  on_conflict_or_missing_fact: Escalate to the T orchestrator with exact file paths, command outputs, and the decision required.
acceptance:
- *id001
- Report changed files and verification evidence to the T orchestrator.
