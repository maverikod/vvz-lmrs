  step_id: G-005
  name: Runtime Execution, Public Commands, Errors, and Telemetry
  description: Define runtime backend abstraction, normalized runtime client behavior, public command semantics, structured error outcomes, and telemetry feedback loops. This step turns admitted requests and lifecycle operations into observable command results without owning adapter registration or command metadata generation.
