- Reading or modifying plan scopes outside this G unless explicitly escalated and approved
- Delegating directly to AS executors except through a T orchestrator
- Guessing missing details
acceptance:
- All T results accepted
- All changes verified through proxy against the server project
- Escalations resolved or propagated to root
