  objects:
  - TelemetryRecord
  prompt: Create lmrs/telemetry.py and define frozen dataclass TelemetryRecord with request_id, predicted_tokens, predicted_vram, actual_prompt_tokens, actual_output_tokens, latency, queue_wait, vram_snapshot, admission_verdict, reason_code, lmcache_hit_tokens, lmcache_miss_tokens, lmcache_lookup_latency, lmcache_write_latency, eviction_events, and metadata. It is the structured telemetry record for one request comparing predicted versus actual facts. Do not add aggregation or calibration logic in this step.
