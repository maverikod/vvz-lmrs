atomic_step_spec:
  step_id: A-004
  parent_tactical_step: T-001
  name: Define RuntimeClient
  target_file: lmrs/runtime_client.py
  operation: modify_file
  priority: 4
  depends_on:
  - A-003
  concepts:
  - C-015
  - C-016
  objects:
  - RuntimeClient
  prompt: Modify lmrs/runtime_client.py after A-001 through A-003. Append dataclass RuntimeClient with backend RuntimeBackend and an execute method or function that accepts an already-admitted request and a runtime profile, calls the selected backend, and returns NormalizedRuntimeResult on success or RuntimeFailureSignal on failure as contract stubs. It hides backend differences and must not make admission decisions or re-run admission. Do not generate public command metadata here.
  verification: &id001
    type: static_analysis
    target: lmrs/runtime_client.py::RuntimeClient
    expected: RuntimeClient executes admitted requests against a selected backend and returns a normalized result or a structured failure signal without making admission decisions.
  status: done
hrs_mrs_excerpts:
- concept_id: C-015
  name: Runtime Backend
  definition: An execution backend abstraction that runs only requests admitted by LMRS.
  properties:
  - Supported backend examples include vLLM, Ollama, llama.cpp, GPT-OSS runtime, or another local runtime.
  - The runtime backend does not make admission decisions.
  source_labels:
  - '{run1}'
- concept_id: C-016
  name: Runtime Client
  definition: The abstraction that hides backend differences and returns normalized local model execution results.
  properties:
  - The runtime client returns assistant message, usage, status, runtime metadata, and telemetry.
  - The result must be suitable for normalization back into a canonical provider response.
  source_labels:
  - '{run2}'
  - '{prov}'
