  name: Command Schema and Metadata Contracts
  description: 'Create the command discovery contract: define Command Schema Contract (C-028) and Command Metadata Contract (C-029) as the schema, validation, result, error, example, and help metadata surface used by adapter help, proxy discovery, and operator-facing documentation.'
  concepts:
  - C-028
  - C-029
