atomic_step_spec:
  step_id: A-001
  parent_tactical_step: T-001
  name: Define ThinAdapterCommand base
  target_file: lmrs/adapter/registration.py
  operation: create_file
  priority: 1
  depends_on: []
  concepts:
  - C-027
  - C-003
  objects:
  - ThinAdapterCommand
  prompt: Create lmrs/adapter/registration.py and define ThinAdapterCommand as a base class contract for adapter-facing LMRS command wrappers. Each subclass inherits the adapter Command base, exposes a stable name attribute, may set use_queue for long-running work, validates parameters, delegates to a domain executor or service, and returns adapter SuccessResult or ErrorResult. The class must not embed admission, tokenizer, VRAM, or model lifecycle business logic; it only translates adapter calls into domain service execution per the Adapter-Based MCP Interface. Do not add registration functions in this step.
  verification: &id001
    type: static_analysis
    target: lmrs/adapter/registration.py::ThinAdapterCommand
    expected: ThinAdapterCommand defines a stable-name validate-delegate-return wrapper contract that returns adapter success or error results and embeds no LMRS business logic.
  status: done
hrs_mrs_excerpts:
- concept_id: C-003
  name: Adapter-Based MCP Interface
  definition: The public MCP command surface implemented according to mcp_proxy_adapter conventions.
  properties:
  - The service is built on mcp_proxy_adapter principles.
  - Public commands expose schemas, validation, execution, metadata, structured responses, structured errors, healthcheck, and MCP Proxy registration.
  source_labels:
  - '{adpt}'
- concept_id: C-027
  name: Thin Adapter Command
  definition: A public LMRS command class that translates adapter calls into domain service execution without owning LMRS business logic.
  properties:
  - Each command inherits the adapter Command base class.
  - Each command exposes a stable name and uses use_queue for long-running work when required.
  - Each command validates parameters, delegates to a domain executor or service, and returns adapter SuccessResult or ErrorResult.
  - Adapter command classes do not embed admission, tokenizer, VRAM, or model lifecycle business logic.
  source_labels:
  - '{acmd}'
