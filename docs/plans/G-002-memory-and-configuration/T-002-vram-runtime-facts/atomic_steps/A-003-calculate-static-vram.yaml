prompt: "Target file: lmrs/vram.py\nOperation: modify_file\n\nCurrent file after lower-priority
  steps contains VramRuntimeFacts and DynamicVramState exactly as defined by A-001
  and A-002.\n\nMRS excerpt:\n- C-008 requires measured_model_static_vram to be the
  difference between service_baseline_free_vram and model_loaded_free_vram for a concrete
  model/runtime/quantization/hardware profile.\n\nAppend exactly this function:\n\
  ```python\n\n\ndef calculate_static_vram(facts: VramRuntimeFacts) -> int:\n    \"\
  \"\"Return measured model static VRAM bytes from baseline and loaded facts.\"\"\"\
  \n    if facts.model_loaded_free_vram_bytes is None:\n        raise ValueError(\"\
  model_loaded_free_vram_bytes is required\")\n    if facts.service_baseline_free_vram_bytes
  < 0 or facts.model_loaded_free_vram_bytes < 0:\n        raise ValueError(\"VRAM
  measurements must be non-negative\")\n    if facts.model_loaded_free_vram_bytes
  > facts.service_baseline_free_vram_bytes:\n        raise ValueError(\"model-loaded
  free VRAM cannot exceed service baseline free VRAM\")\n    return facts.service_baseline_free_vram_bytes
  - facts.model_loaded_free_vram_bytes\n```\n\nConstraints:\n- Do not infer static
  VRAM from model size or quantization.\n- The function must use measured free-VRAM
  fields only."
