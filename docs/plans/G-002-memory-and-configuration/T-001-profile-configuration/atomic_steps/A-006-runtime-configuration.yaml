  reserve, model profiles, runtime backend, tokenizer, queue policy, and queue limits.\n\
  \nCurrent full content of lmrs/configuration.py before this modification:\n```python\n\
  from __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\
  from typing import Mapping\n\n\n@dataclass(frozen=True)\nclass HardwareProfile:\n\
  \    \"\"\"Hardware capacity profile used by LMRS admission and calibration logic.\"\
  \"\"\n\n    gpu_count: int = 1\n    total_vram_bytes: int = 24 * 1024**3\n    total_ram_bytes:
  int = 128 * 1024**3\n    gpu_model: str | None = None\n    metadata: Mapping[str,
  str] = field(default_factory=dict)\n\n\n@dataclass(frozen=True)\nclass KVCacheProfile:\n\
  \    \"\"\"Model KV-cache parameters used to derive memory facts.\"\"\"\n\n    layers:
  int\n    kv_heads: int\n    head_dim: int\n    kv_element_bytes: int\n    declared_context_window:
  int\n    runtime_kv_dtype: str = \"fp16\"\n    quantization_profile: str | None
