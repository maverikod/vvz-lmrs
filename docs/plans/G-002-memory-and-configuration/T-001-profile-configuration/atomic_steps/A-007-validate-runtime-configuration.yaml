prompt: "Target file: lmrs/configuration.py\nOperation: modify_file\n\nMRS excerpt:\n\
  - C-021 Runtime Configuration: service configuration owns hardware profile, resident
  services, safety margin, runtime reserve, model profiles, runtime backend, tokenizer
  profile, queue policy, and queue limits. These facts must be made available to capacity
  calculations.\n\nCurrent full content of lmrs/configuration.py before this modification:\n\
  ```python\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass,
  field\nfrom typing import Mapping\n\n\n@dataclass(frozen=True)\nclass HardwareProfile:\n\
  \    \"\"\"Hardware capacity profile used by LMRS admission and calibration logic.\"\
  \"\"\n\n    gpu_count: int = 1\n    total_vram_bytes: int = 24 * 1024**3\n    total_ram_bytes:
  int = 128 * 1024**3\n    gpu_model: str | None = None\n    metadata: Mapping[str,
  str] = field(default_factory=dict)\n\n\n@dataclass(frozen=True)\nclass KVCacheProfile:\n\
  \    \"\"\"Model KV-cache parameters used to derive memory facts.\"\"\"\n\n    layers:
  int\n    kv_heads: int\n    head_dim: int\n    kv_element_bytes: int\n    declared_context_window:
  int\n    runtime_kv_dtype: str = \"fp16\"\n    quantization_profile: str | None
  = None\n\n    def kv_bytes_per_token(self) -> int:\n        \"\"\"Return worst-case
  KV-cache bytes required for one token.\"\"\"\n\n        return self.layers * 2 *
  self.kv_heads * self.head_dim * self.kv_element_bytes\n\n    def kv_full_window_bytes(self)
  -> int:\n        \"\"\"Return worst-case KV-cache bytes for the declared context
  window.\"\"\"\n\n        return self.declared_context_window * self.kv_bytes_per_token()\n\
  \n\n@dataclass(frozen=True)\nclass ModelProfile:\n    \"\"\"Runtime-independent
  profile for one locally executable model.\"\"\"\n\n    model_name: str\n    runtime_backend:
  str\n    model_path_or_endpoint: str\n    declared_context_window: int\n    tokenizer_profile:
  str\n    load_policy: str\n    kv_cache_profile: KVCacheProfile\n    concurrency_policy:
  Mapping[str, int] = field(default_factory=dict)\n    options: Mapping[str, str]
  = field(default_factory=dict)\n\n\n@dataclass(frozen=True)\nclass RuntimeConfiguration:\n\
  \    \"\"\"Configuration-owned LMRS profile facts consumed by capacity logic.\"\"\
  \"\n\n    hardware_profile: HardwareProfile\n    model_profiles: Mapping[str, ModelProfile]\n\
  \    default_model_name: str\n    resident_services: tuple[str, ...] = ()\n    safety_margin_bytes:
  int = 0\n    runtime_reserve_bytes: int = 0\n    queue_policy: str = \"largest_fit\"\
  \n    queue_limits: Mapping[str, int] = field(default_factory=dict)\n```\n\nModify
  the file by adding this function after RuntimeConfiguration:\n```python\n\ndef validate_runtime_configuration(config:
  RuntimeConfiguration) -> RuntimeConfiguration:\n    \"\"\"Validate configuration-owned
  profile facts and return the same config.\"\"\"\n\n    hardware = config.hardware_profile\n\
  \    if hardware.gpu_count < 1:\n        raise ValueError(\"hardware_profile.gpu_count
  must be at least 1\")\n    if hardware.total_vram_bytes <= 0:\n        raise ValueError(\"\
  hardware_profile.total_vram_bytes must be positive\")\n    if hardware.total_ram_bytes
  <= 0:\n        raise ValueError(\"hardware_profile.total_ram_bytes must be positive\"\
  )\n    if not config.model_profiles:\n        raise ValueError(\"model_profiles
  must not be empty\")\n    if config.default_model_name not in config.model_profiles:\n\
  \        raise ValueError(\"default_model_name must reference a configured model\"\
  )\n    if config.safety_margin_bytes < 0:\n        raise ValueError(\"safety_margin_bytes
  must be non-negative\")\n    if config.runtime_reserve_bytes < 0:\n        raise
  ValueError(\"runtime_reserve_bytes must be non-negative\")\n    for model_name,
  model in config.model_profiles.items():\n        if model.model_name != model_name:\n\
  \            raise ValueError(\"model_profiles keys must match model_name\")\n \
  \       if model.declared_context_window <= 0:\n            raise ValueError(\"\
  model declared_context_window must be positive\")\n        kv_profile = model.kv_cache_profile\n\
  \        if kv_profile.layers <= 0 or kv_profile.kv_heads <= 0 or kv_profile.head_dim
  <= 0:\n            raise ValueError(\"kv cache dimensions must be positive\")\n\
  \        if kv_profile.kv_element_bytes <= 0:\n            raise ValueError(\"kv_element_bytes
  must be positive\")\n        if kv_profile.declared_context_window != model.declared_context_window:\n\
  \            raise ValueError(\"kv profile context window must match model context
  window\")\n    return config\n```\n\nConstraints:\n- Keep all classes unchanged.\n\
  - Use existing imports only.\n- The function signature and exception messages must
  match exactly.\n- The function must return the same RuntimeConfiguration object
  when valid."
