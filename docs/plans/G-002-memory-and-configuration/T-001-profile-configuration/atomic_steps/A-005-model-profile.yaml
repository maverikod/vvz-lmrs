prompt: "Target file: lmrs/configuration.py\nOperation: modify_file\n\nMRS excerpt:\n\
  - C-005 Model Profile: model-specific runtime description that includes model_name,
  runtime backend, path or endpoint, declared context window, tokenizer profile, load
  policy, KV-cache profile, and concurrency policy.\n- C-045 Model KV Memory Profile:
  concrete model profile owns the KV-cache memory profile and derived facts.\n\nCurrent
  full content of lmrs/configuration.py before this modification:\n```python\nfrom
  __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom
  typing import Mapping\n\n\n@dataclass(frozen=True)\nclass HardwareProfile:\n   \
  \ \"\"\"Hardware capacity profile used by LMRS admission and calibration logic.\"\
  \"\"\n\n    gpu_count: int = 1\n    total_vram_bytes: int = 24 * 1024**3\n    total_ram_bytes:
  int = 128 * 1024**3\n    gpu_model: str | None = None\n    metadata: Mapping[str,
  str] = field(default_factory=dict)\n\n\n@dataclass(frozen=True)\nclass KVCacheProfile:\n\
  \    \"\"\"Model KV-cache parameters used to derive memory facts.\"\"\"\n\n    layers:
  int\n    kv_heads: int\n    head_dim: int\n    kv_element_bytes: int\n    declared_context_window:
  int\n    runtime_kv_dtype: str = \"fp16\"\n    quantization_profile: str | None
  = None\n\n    def kv_bytes_per_token(self) -> int:\n        \"\"\"Return worst-case
  KV-cache bytes required for one token.\"\"\"\n\n        return self.layers * 2 *
  self.kv_heads * self.head_dim * self.kv_element_bytes\n\n    def kv_full_window_bytes(self)
  -> int:\n        \"\"\"Return worst-case KV-cache bytes for the declared context
  window.\"\"\"\n\n        return self.declared_context_window * self.kv_bytes_per_token()\n\
  ```\n\nModify the file by adding this dataclass after KVCacheProfile:\n```python\n\
  \n@dataclass(frozen=True)\nclass ModelProfile:\n    \"\"\"Runtime-independent profile
  for one locally executable model.\"\"\"\n\n    model_name: str\n    runtime_backend:
  str\n    model_path_or_endpoint: str\n    declared_context_window: int\n    tokenizer_profile:
  str\n    load_policy: str\n    kv_cache_profile: KVCacheProfile\n    concurrency_policy:
  Mapping[str, int] = field(default_factory=dict)\n    options: Mapping[str, str]
  = field(default_factory=dict)\n```\n\nConstraints:\n- Keep HardwareProfile and KVCacheProfile
  unchanged.\n- Use existing imports only.\n- ModelProfile must be frozen.\n- Do not
  add RuntimeConfiguration or validation in this step."
