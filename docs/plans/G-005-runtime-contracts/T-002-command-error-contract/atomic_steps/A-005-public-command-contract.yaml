prompt: Modify lmrs/commands.py after A-001 through A-004. Append dataclass PublicCommandContract
  that declares, for each CommandName, its accepted operation category and the CommandResult
  shape it returns, as contract stubs. The estimate command performs dry-run token
  accounting and admission and returns a would_* outcome; the chat command performs
  token accounting and admission and returns executed, queued, or rejected; queue_status
  reports request queue state. It must not perform runtime execution or admission
  logic itself, only declare the contract.
