prompt: Modify lmrs/telemetry.py after A-001 and A-002. Append frozen dataclass 
  TelemetryCalibrationObservation with model_name, runtime_backend, 
  quantization_profile, hardware_profile, prompt_length, measured_vram_growth, 
  kv_cache_cost_sample, per_request_overhead_sample, sample_count, and metadata.
  It is an aggregated observation input offered to Calibration Profile keyed by 
  model, runtime, quantization, and hardware. It does not own or compute the 
  calibration profile, and it is distinct from the calibration-owned 
  CalibrationObservation defined in lmrs.calibration.
