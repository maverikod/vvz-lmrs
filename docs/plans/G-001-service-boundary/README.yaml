step_id: G-001
name: Service Boundary and Gateway Contract
description: Define LMRS as a separate local-model runtime service, establish 
  its provider-gateway boundary, and describe the canonical request flow between
  the gateway and the adapter-facing service. This step also fixes the MVP 
  envelope and the top-level invariant that oversized prompts are blocked before
  runtime execution.
