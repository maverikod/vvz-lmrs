step_id: G-003
name: Token Accounting, Admission, Queue, and Scheduling
description: Define the request preflight path from final prompt token 
  accounting through capacity estimation, conservative admission, queue 
  placement, largest-fit scheduling, and launch-time recheck. This step includes
  the request dynamic VRAM formula and the LMCache admission constraint only as 
  admission semantics, not as cache storage management.
