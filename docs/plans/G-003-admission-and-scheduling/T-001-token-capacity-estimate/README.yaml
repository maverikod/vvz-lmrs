step_id: T-001
parent_global_step: G-003
name: Token and Capacity Estimate
description: 'Create the preflight estimate object: apply Token Accounting (C-010),
  produce Request Capacity Estimate (C-011), compute Request Dynamic VRAM Requirement
  (C-047), and consume the relevant KV and usable VRAM facts without making an admission
  decision.'
concepts:
- C-010
- C-011
- C-047
- C-044
- C-046
inputs:
- name: canonical_request
  type: request_contract
  description: The canonical request structure consumed by token accounting, 
    including final prompt material and reserved output tokens.
- name: memory_facts
  type: capacity_fact_set
  description: KV byte facts and usable dynamic VRAM facts consumed by token 
    capacity estimation.
outputs:
- name: token_breakdown
  type: estimate_component
  description: Input, tool, service, and reserved output token counts with 
    tokenizer accuracy status.
- name: dynamic_vram_requirement
  type: estimate_component
  description: Required dynamic VRAM bytes computed before admission using 
    request tokens and overhead fields.
atomic_steps:
- A-001
- A-002
- A-003
- A-004
- A-005
status: draft
