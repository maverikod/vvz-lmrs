meta:
  artifact: concept_python_object_matrix
  source_layers:
  - HRS
  - MRS
  - GS
  - TS
  status: draft
  note: Matrix is derived from planning concepts and G/T branches, not from 
    atomic step files.
packages:
- package: lmrs
  role: Local Model Runtime Service implementation package
modules:
- module: lmrs.contracts
  objects:
  - name: AdapterExposure
    kind: dataclass
    concepts:
    - C-003
    tactical_steps:
    - T-001
    role: Adapter-facing exposure requirements for public MCP surface.
  - name: MVPScope
    kind: dataclass
    concepts:
    - C-022
    tactical_steps:
    - T-001
    role: Explicit MVP inclusion and exclusion contract.
  - name: ServiceBoundary
    kind: dataclass
    concepts:
    - C-001
    - C-002
    - C-003
    - C-022
    tactical_steps:
    - T-001
    role: Ownership boundary for LMRS and external provider gateway delegation.
  - name: build_default_service_boundary
    kind: function
    concepts:
    - C-001
    - C-002
    - C-003
    - C-022
    tactical_steps:
    - T-001
    role: Build the default HRS/MRS service boundary instance.
  - name: boundary_snapshot
    kind: function
    concepts:
    - C-001
    - C-003
    - C-022
    tactical_steps:
    - T-001
    role: Return serializable boundary state for command and telemetry surfaces.
