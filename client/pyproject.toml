[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmrs-client"
version = "0.1.10"
description = "Client library for the Local Model Runtime Service (LMRS)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Vasiliy Zdanovskiy", email = "vasilyvz@gmail.com"},
]
# Pinned to the same adapter range the server declares: the client is built on
# the framework's JSON-RPC client, so a client paired with a different adapter
# major would speak a different transport contract than the server it talks to.
dependencies = [
    "mcp-proxy-adapter>=8.10",
]

[project.scripts]
# lmrs-client drives a server from the shell; pipeline is the fleet-contract
# acceptance runner, so an operator can prove a deployment with one command
# after nothing more than pip install lmrs-client.
lmrs-client = "lmrs_client.cli:main"
pipeline = "lmrs_client.pipeline:main"

[tool.setuptools.packages.find]
include = ["lmrs_client*"]
namespaces = false
