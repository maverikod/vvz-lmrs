[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmrs"
version = "0.1.17"
description = "Local Model Runtime Service"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "Vasiliy Zdanovskiy", email = "vasilyvz@gmail.com"},
]
dependencies = [
    "PyYAML",
]

[project.optional-dependencies]
server = [
    "mcp-proxy-adapter>=8.10.29",
    # The disk model cache downloads weights through the hub client. It is
    # already present in the vLLM runtime image; declaring it here keeps a
    # server install from depending on that coincidence.
    "huggingface-hub",
]
dev = [
    "pytest",
    "ruff",
    "flake8",
    "mypy",
]

[project.scripts]
lmrs = "lmrs.__main__:main"
lmrsmgr = "lmrs.manager:main"
pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["lmrs*", "pipeline*"]
namespaces = false

[tool.ruff]
# ruff and .flake8 are kept as one setting pair: same line length, same
# exclusions, same rule set, same per-file ignores. Any change here must be
# mirrored in .flake8, otherwise the two pipeline checks can disagree about
# the same line.
line-length = 220
# Matches requires-python above.
target-version = "py312"
# Same exclusions as .flake8. mtls-certs holds generated certificate helper
# scripts and is gitignored; ruff would skip it anyway, but it is listed so
# the two exclusion lists read identically instead of one relying on git.
extend-exclude = [".venv", "venv", "old_code", ".git", "__pycache__", "mtls-certs"]

[tool.ruff.lint]
# Pinned explicitly. Without a selection ruff applies its own defaults, and
# those change between releases: upgrading 0.15 -> 0.16 turned this project's
# verdict from clean into 84 findings without a single line of code changing.
# An unpinned linter makes the quality gate non-deterministic, so the rule set
# is stated here rather than inherited. W is included because .flake8 enforces
# pycodestyle warnings too, and the pair must select the same families.
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Identical to the per-file-ignores declared in .flake8.
"tools/plan_audit.py" = ["E401", "E302", "E305"]
"tools/plan_locate.py" = ["F401", "E401", "E302", "E305"]
